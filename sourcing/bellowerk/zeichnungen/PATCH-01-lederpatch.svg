<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="800" viewBox="0 0 1300 800" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="none" stroke="#000" stroke-width="2">
  <rect x="0" y="0" width="1300" height="800" fill="#fff" stroke="none"/>
  <text x="40" y="40" font-size="25" font-weight="bold" fill="#000" stroke="none">PATCH-01 Engraved Leather Patch — scale 4:1 — Bellowerk Manufaktur, v1.2, 18 Sep 2026</text>
  <text x="40" y="66" font-size="15" fill="#000" stroke="none">Veg-tan cowhide 2.0–2.5 mm, cognac/medium brown · laser-engraved, dark burn, no foil, no paint · 2 solid brass Chicago screws, domed head Ø 8–9 mm · NO stitching</text>
  <text x="40" y="90" font-size="15" font-weight="bold" fill="#000" stroke="none">v1.2: PA-L is the regular size for the lead LE-01 (was PA-S). Three sizes, same layout and same artwork.</text>

  <!-- PA-L 110x18 at 4:1 = 440x72 -->
  <g transform="translate(80,150)">
    <text x="0" y="-16" fill="#000" stroke="none" font-weight="bold">PA-L 110 × 18 mm — lead LE-01 (20 mm strap)</text>
    <rect x="0" y="0" width="440" height="72" rx="12" fill="#b9793f" stroke="#000" stroke-width="2.5"/>
    <circle cx="34" cy="36" r="17" fill="#c9a44a" stroke="#000"/>
    <circle cx="406" cy="36" r="17" fill="#c9a44a" stroke="#000"/>
    <text x="220" y="34" text-anchor="middle" fill="#2a1a0e" stroke="none" font-size="24" font-weight="600" letter-spacing="7" font-family="Futura, 'Century Gothic', 'Josefin Sans', Arial, sans-serif">BELLOWERK</text>
    <text x="300" y="61" text-anchor="middle" fill="#2a1a0e" stroke="none" font-size="19" font-style="italic" font-family="'Brush Script MT', 'Segoe Script', cursive">Manufaktur</text>
    <g stroke-width="1.5">
      <line x1="0" y1="100" x2="440" y2="100"/><line x1="0" y1="93" x2="0" y2="107"/><line x1="440" y1="93" x2="440" y2="107"/>
      <text x="220" y="120" text-anchor="middle" fill="#000" stroke="none" font-size="14">110</text>
      <line x1="34" y1="140" x2="406" y2="140"/><line x1="34" y1="133" x2="34" y2="147"/><line x1="406" y1="133" x2="406" y2="147"/>
      <text x="220" y="160" text-anchor="middle" fill="#000" stroke="none" font-size="14">93 (hole spacing) · holes Ø 4.5, centres 8.5 mm from ends</text>
      <line x1="470" y1="0" x2="470" y2="72"/><line x1="463" y1="0" x2="477" y2="0"/><line x1="463" y1="72" x2="477" y2="72"/>
      <text x="482" y="40" fill="#000" stroke="none" font-size="14">18</text>
      <text x="482" y="16" fill="#000" stroke="none" font-size="12">R 3</text>
    </g>
    <text x="0" y="182" fill="#000" stroke="none" font-size="13">Cap height 5.0 mm · script x-height 2.8 mm</text>
    <text x="0" y="202" fill="#000" stroke="none" font-size="13">18 mm on the 20 mm strap = 1 mm reveal each side</text>
  </g>

  <!-- PA-M 85x18 at 4:1 = 340x72 -->
  <g transform="translate(80,395)">
    <text x="0" y="-16" fill="#000" stroke="none" font-weight="bold">PA-M 85 × 18 mm — collar M/L/XL, 25 mm lead (25–40 mm straps)</text>
    <rect x="0" y="0" width="340" height="72" rx="12" fill="#b9793f" stroke="#000" stroke-width="2.5"/>
    <circle cx="28" cy="36" r="17" fill="#c9a44a" stroke="#000"/>
    <circle cx="312" cy="36" r="17" fill="#c9a44a" stroke="#000"/>
    <text x="170" y="34" text-anchor="middle" fill="#2a1a0e" stroke="none" font-size="22" font-weight="600" letter-spacing="5" font-family="Futura, 'Century Gothic', 'Josefin Sans', Arial, sans-serif">BELLOWERK</text>
    <text x="235" y="60" text-anchor="middle" fill="#2a1a0e" stroke="none" font-size="17" font-style="italic" font-family="'Brush Script MT', 'Segoe Script', cursive">Manufaktur</text>
    <g stroke-width="1.5">
      <line x1="0" y1="100" x2="340" y2="100"/><line x1="0" y1="93" x2="0" y2="107"/><line x1="340" y1="93" x2="340" y2="107"/>
      <text x="170" y="120" text-anchor="middle" fill="#000" stroke="none" font-size="14">85</text>
      <line x1="28" y1="140" x2="312" y2="140"/><line x1="28" y1="133" x2="28" y2="147"/><line x1="312" y1="133" x2="312" y2="147"/>
      <text x="170" y="160" text-anchor="middle" fill="#000" stroke="none" font-size="14">71 (hole spacing) · centres 7 mm from ends</text>
      <line x1="370" y1="0" x2="370" y2="72"/><line x1="363" y1="0" x2="377" y2="0"/><line x1="363" y1="72" x2="377" y2="72"/>
      <text x="382" y="40" fill="#000" stroke="none" font-size="14">18</text>
    </g>
    <text x="0" y="182" fill="#000" stroke="none" font-size="13">Cap height 4.5 mm · script x-height 2.5 mm</text>
  </g>

  <!-- PA-S 65x14 at 4:1 = 260x56 -->
  <g transform="translate(80,620)">
    <text x="0" y="-16" fill="#000" stroke="none" font-weight="bold">PA-S 65 × 14 mm — hand loop HS-01, collar S</text>
    <rect x="0" y="0" width="260" height="56" rx="12" fill="#b9793f" stroke="#000" stroke-width="2.5"/>
    <circle cx="28" cy="28" r="17" fill="#c9a44a" stroke="#000"/>
    <circle cx="232" cy="28" r="17" fill="#c9a44a" stroke="#000"/>
    <text x="130" y="27" text-anchor="middle" fill="#2a1a0e" stroke="none" font-size="17" font-weight="600" letter-spacing="4" font-family="Futura, 'Century Gothic', 'Josefin Sans', Arial, sans-serif">BELLOWERK</text>
    <text x="175" y="47" text-anchor="middle" fill="#2a1a0e" stroke="none" font-size="13" font-style="italic" font-family="'Brush Script MT', 'Segoe Script', cursive">Manufaktur</text>
    <g stroke-width="1.5">
      <line x1="0" y1="84" x2="260" y2="84"/><line x1="0" y1="77" x2="0" y2="91"/><line x1="260" y1="77" x2="260" y2="91"/>
      <text x="130" y="104" text-anchor="middle" fill="#000" stroke="none" font-size="14">65</text>
      <line x1="28" y1="124" x2="232" y2="124"/><line x1="28" y1="117" x2="28" y2="131"/><line x1="232" y1="117" x2="232" y2="131"/>
      <text x="130" y="144" text-anchor="middle" fill="#000" stroke="none" font-size="14">51 (hole spacing) · centres 7 mm from ends</text>
      <line x1="290" y1="0" x2="290" y2="56"/><line x1="283" y1="0" x2="297" y2="0"/><line x1="283" y1="56" x2="297" y2="56"/>
      <text x="302" y="32" fill="#000" stroke="none" font-size="14">14</text>
    </g>
    <text x="0" y="164" fill="#000" stroke="none" font-size="13">Cap height 3.5 mm · script x-height 2.0 mm</text>
  </g>

  <!-- right column: lettering, section, positions -->
  <g transform="translate(640,150)">
    <text x="0" y="-16" fill="#000" stroke="none" font-weight="bold">Lettering and artwork</text>
    <text x="0" y="8" fill="#000" stroke="none" font-size="13">Line 1 "BELLOWERK": spaced geometric sans capitals as in the logo,</text>
    <text x="0" y="28" fill="#000" stroke="none" font-size="13">tracking +20 % · Line 2 "Manufaktur": brush script, under the right half.</text>
    <text x="0" y="48" fill="#000" stroke="none" font-size="13">Engraving depth 0.2–0.3 mm. Min line 0.3 mm, min gap 0.5 mm.</text>
    <text x="0" y="68" fill="#000" stroke="none" font-size="13">Same layout as the current "HERR BELLO &amp; FRAU WUFF / Manufaktur"</text>
    <text x="0" y="88" fill="#000" stroke="none" font-size="13">patch (see photos). Björn supplies the vector logo — the artwork in this</text>
    <text x="0" y="108" fill="#000" stroke="none" font-size="13">drawing is a placeholder for size and position only.</text>

    <text x="0" y="158" fill="#000" stroke="none" font-weight="bold">Section (schematic)</text>
    <rect x="0" y="176" width="360" height="12" fill="#b9793f" stroke="#000"/>
    <rect x="0" y="188" width="360" height="22" fill="#ddd" stroke="#000"/>
    <path d="M 55 176 A 12 6 0 0 1 79 176 Z" fill="#c9a44a" stroke="#000"/><rect x="63" y="176" width="8" height="34" fill="#c9a44a" stroke="#000"/><rect x="58" y="210" width="18" height="5" fill="#c9a44a" stroke="#000"/>
    <path d="M 281 176 A 12 6 0 0 1 305 176 Z" fill="#c9a44a" stroke="#000"/><rect x="289" y="176" width="8" height="34" fill="#c9a44a" stroke="#000"/><rect x="284" y="210" width="18" height="5" fill="#c9a44a" stroke="#000"/>
    <text x="0" y="238" fill="#000" stroke="none" font-size="13">patch leather 2.0–2.5 mm on strap 3.5–4.0 mm</text>
    <text x="0" y="258" fill="#000" stroke="none" font-size="13">Chicago screw solid brass, domed head Ø 8–9 mm outside,</text>
    <text x="0" y="278" fill="#000" stroke="none" font-size="13">flat head inside, post 8 mm, thread-locked</text>

    <text x="0" y="326" fill="#000" stroke="none" font-weight="bold">Position on the product</text>
    <text x="0" y="348" fill="#000" stroke="none" font-size="13">Collar: centred on the strap, 30 mm behind the buckle fold.</text>
    <text x="0" y="368" fill="#000" stroke="none" font-size="13">Lead LE-01: PA-L on the hook B side, outer end 30 mm before the</text>
    <text x="0" y="388" fill="#000" stroke="none" font-size="13">screw of the hook B braid = 185 mm from the hook B eye.</text>
    <text x="0" y="408" fill="#000" stroke="none" font-size="13">Hand loop HS-01: on the overlap.</text>

    <text x="0" y="452" fill="#000" stroke="none" font-size="13">NOT acceptable: woven / embroidered / PVC / printed patch, foil stamp,</text>
    <text x="0" y="472" fill="#000" stroke="none" font-size="13">glue as the only fixing, PU or bonded leather, stitching.</text>
  </g>
</svg>
