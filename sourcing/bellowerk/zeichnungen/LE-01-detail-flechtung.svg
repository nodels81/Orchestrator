<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="none" stroke="#000" stroke-width="1.6">
  <rect x="0" y="0" width="1123" height="794" fill="#fff" stroke="none"/>

  <text x="30" y="34" font-size="20" font-weight="bold" fill="#000" stroke="none">LE-01 · Sheet 2/3 · BLEED KNOT — FULL SIZE 1:1 CHECK SHEET · A4 landscape · v3.0 · 18 Sep 2026</text>
  <text x="30" y="56" font-size="12.5" fill="#000" stroke="none">Print at 100% / "actual size", no page scaling, then CHECK THE CONTROL BAR at the bottom — it must measure exactly 100 mm. Lay the finished lead directly</text>
  <text x="30" y="73" font-size="12.5" fill="#000" stroke="none">on this sheet and compare. Sheet 3/3 shows how the knot is tied. The strap is never cut into strands and never cut through.</text>

  <!-- ================= 1 · HOOK B END, FULL SIZE ================= -->
  <text x="30" y="108" font-size="14" font-weight="bold" fill="#000" stroke="none">1 · Hook B end, full size — ring 3 and the hook eye are caught in the same fold</text>

  <!-- strap 20 mm = 75.6 px, from x=40 to the ring -->
  <g stroke-width="2">
    <line x1="40" y1="130" x2="760" y2="130"/>
    <line x1="40" y1="205.6" x2="760" y2="205.6"/>
    <line x1="40" y1="130" x2="40" y2="205.6"/>
  </g>

  <!-- knot chain 115 mm = 434.6 px, from 325.4 to 760; V marks every 20 mm = 75.6 px -->
  <g stroke-width="1.5">
    <path d="M 249.8 130 Q 286.0 148 322.2 167.8 Q 286.0 188 249.8 205.6"/>
    <path d="M 322.2 130 Q 358.4 148 394.7 167.8 Q 358.4 188 322.2 205.6"/>
    <path d="M 394.7 130 Q 430.9 148 467.1 167.8 Q 430.9 188 394.7 205.6"/>
    <path d="M 467.1 130 Q 503.3 148 539.5 167.8 Q 503.3 188 467.1 205.6"/>
    <path d="M 539.5 130 Q 575.7 148 612.0 167.8 Q 575.7 188 539.5 205.6"/>
    <path d="M 612.0 130 Q 648.2 148 684.4 167.8 Q 648.2 188 612.0 205.6"/>
  </g>

  <!-- ring 3: outer Ø 40 mm = 151.2 px, wire 5 mm -->
  <circle cx="760" cy="167.8" r="75.6" stroke-width="2.5"/>
  <circle cx="760" cy="167.8" r="56.7" stroke-width="1.5"/>
  <!-- hook eye centre 30 mm = 113.4 px after the ring centre -->
  <circle cx="873.4" cy="167.8" r="37.8" stroke-width="2.5"/>
  <text x="873.4" y="118" text-anchor="middle" fill="#000" stroke="none" font-size="12" font-weight="bold">hook B eye</text>
  <text x="800" y="258" fill="#000" stroke="none" font-size="12" font-weight="bold">ring 3 · outer Ø 40</text>
  <line x1="796" y1="254" x2="768" y2="238" stroke-width="1"/>

  <!-- chicago screw 10 mm before the chain, head Ø 9 mm = 34 px -->
  <circle cx="212" cy="167.8" r="17" stroke-width="1.8"/>
  <line x1="201" y1="167.8" x2="223" y2="167.8" stroke-width="1.8"/>
  <!-- tail end 20 mm before the screw -->
  <g stroke-dasharray="6 4" stroke-width="1.3"><line x1="136.4" y1="130" x2="136.4" y2="205.6"/></g>

  <g stroke-width="1.1">
    <line x1="249.8" y1="238" x2="684.4" y2="238"/>
    <path d="M 249.8 238 l 8 -4 v 8 z" fill="#000"/><path d="M 684.4 238 l -8 -4 v 8 z" fill="#000"/>
    <text x="467" y="232" text-anchor="middle" fill="#000" stroke="none" font-size="12.5" font-weight="bold">knot chain 115 mm · 5–6 V</text>

    <line x1="249.8" y1="264" x2="322.2" y2="264"/>
    <path d="M 249.8 264 l 8 -4 v 8 z" fill="#000"/><path d="M 322.2 264 l -8 -4 v 8 z" fill="#000"/>
    <text x="332" y="268" fill="#000" stroke="none" font-size="12">pitch approx. 20 mm (even spacing matters more than the exact figure)</text>

    <line x1="212" y1="290" x2="249.8" y2="290"/>
    <path d="M 212 290 l 8 -4 v 8 z" fill="#000"/><path d="M 249.8 290 l -8 -4 v 8 z" fill="#000"/>
    <text x="60" y="294" fill="#000" stroke="none" font-size="12">screw 10 mm</text>
    <text x="60" y="312" fill="#000" stroke="none" font-size="12">tail ends 20 mm further (dashed)</text>

    <line x1="760" y1="290" x2="873.4" y2="290"/>
    <path d="M 760 290 l 8 -4 v 8 z" fill="#000"/><path d="M 873.4 290 l -8 -4 v 8 z" fill="#000"/>
    <text x="816" y="310" text-anchor="middle" fill="#000" stroke="none" font-size="12">30 mm</text>

    <line x1="1100" y1="130" x2="1100" y2="205.6"/>
    <line x1="1094" y1="130" x2="1106" y2="130"/><line x1="1094" y1="205.6" x2="1106" y2="205.6"/>
    <text x="1090" y="125" text-anchor="end" fill="#000" stroke="none" font-size="12">20 mm</text>
  </g>

  <!-- ================= 2 · MIDDLE RING + SLIT ================= -->
  <text x="30" y="360" font-size="14" font-weight="bold" fill="#000" stroke="none">2 · Ring 1 and ring 2, full size — ONE knot, no screw</text>

  <g stroke-width="2">
    <line x1="40" y1="382" x2="330" y2="382"/>
    <line x1="40" y1="457.6" x2="330" y2="457.6"/>
  </g>
  <path d="M 254.4 382 Q 292 400 330 419.8 Q 292 440 254.4 457.6" stroke-width="1.5"/>
  <circle cx="330" cy="419.8" r="56.7" stroke-width="2.5"/>
  <circle cx="330" cy="419.8" r="37.8" stroke-width="1.5"/>
  <g stroke-width="2">
    <line x1="386.7" y1="382" x2="660" y2="382"/>
    <line x1="386.7" y1="457.6" x2="660" y2="457.6"/>
  </g>
  <text x="145" y="400" text-anchor="middle" fill="#000" stroke="none" font-size="12" font-style="italic">lead continues</text>
  <text x="523" y="400" text-anchor="middle" fill="#000" stroke="none" font-size="12" font-style="italic">lead continues</text>
  <text x="330" y="500" text-anchor="middle" fill="#000" stroke="none" font-size="12" font-weight="bold">ring 1 / ring 2 · outer Ø 30</text>

  <text x="700" y="360" font-size="14" font-weight="bold" fill="#000" stroke="none">3 · The slit, full size</text>
  <g stroke-width="2">
    <line x1="710" y1="382" x2="1090" y2="382"/>
    <line x1="710" y1="457.6" x2="1090" y2="457.6"/>
    <line x1="710" y1="382" x2="710" y2="457.6"/>
    <line x1="1090" y1="382" x2="1090" y2="457.6"/>
  </g>
  <line x1="843.3" y1="419.8" x2="956.7" y2="419.8" stroke-width="2.5"/>
  <circle cx="843.3" cy="419.8" r="3.8" stroke-width="1.5"/>
  <circle cx="956.7" cy="419.8" r="3.8" stroke-width="1.5"/>
  <g stroke-width="1.1">
    <line x1="843.3" y1="482" x2="956.7" y2="482"/>
    <path d="M 843.3 482 l 8 -4 v 8 z" fill="#000"/><path d="M 956.7 482 l -8 -4 v 8 z" fill="#000"/>
    <text x="900" y="502" text-anchor="middle" fill="#000" stroke="none" font-size="12" font-weight="bold">30 mm — starting value</text>
  </g>
  <text x="710" y="524" fill="#000" stroke="none" font-size="12">Lengthwise, centred, ends punched Ø 2 mm.</text>

  <!-- ================= NOTES ================= -->
  <text x="30" y="560" fill="#000" stroke="none" font-size="12.5" font-weight="bold">The 115 mm chain and the 5–6 even V are the binding result. The slit length is a starting value — adjust it on the first sample until the chain comes out at 115 mm.</text>
  <text x="30" y="580" fill="#000" stroke="none" font-size="12.5">Hook A: same chain of knots, hook eye only, no ring. Hook A and hook B each get ONE solid brass Chicago screw after the last V; the middle rings get NO screw.</text>
  <text x="30" y="600" fill="#000" stroke="none" font-size="12.5">The rough flesh side showing in every V is correct and wanted — it is the mark of a real bleed knot, not a defect. Knots pulled up tight, no gaps, all V facing the same way.</text>
  <text x="30" y="620" fill="#000" stroke="none" font-size="12.5">Edges bevelled and burnished along the whole lead, including through the knots. No stitching, no rivets. Attachment strength ≥ 2.0 kN.</text>

  <text x="30" y="660" fill="#000" stroke="none" font-size="12.5" font-weight="bold">Before production: send photos of one finished knot from the front AND the back, plus one finished hook end laid on this printed sheet.</text>

  <!-- ================= CONTROL BAR ================= -->
  <g transform="translate(30,706)">
    <text x="0" y="-6" font-size="12.5" font-weight="bold" fill="#000" stroke="none">CONTROL BAR — must measure exactly 100 mm on the print. If it does not, the print is scaled: do not use it to check parts.</text>
    <rect x="0" y="6" width="377.95" height="14" stroke-width="1.6"/>
    <g stroke-width="1.2">
      <line x1="37.8" y1="6" x2="37.8" y2="20"/><line x1="75.6" y1="6" x2="75.6" y2="20"/>
      <line x1="113.4" y1="6" x2="113.4" y2="20"/><line x1="151.2" y1="6" x2="151.2" y2="20"/>
      <line x1="189" y1="2" x2="189" y2="24"/>
      <line x1="226.8" y1="6" x2="226.8" y2="20"/><line x1="264.6" y1="6" x2="264.6" y2="20"/>
      <line x1="302.4" y1="6" x2="302.4" y2="20"/><line x1="340.2" y1="6" x2="340.2" y2="20"/>
    </g>
    <text x="0" y="40" fill="#000" stroke="none" font-size="11">0</text>
    <text x="189" y="40" text-anchor="middle" fill="#000" stroke="none" font-size="11">50</text>
    <text x="377.95" y="40" text-anchor="middle" fill="#000" stroke="none" font-size="11">100 mm</text>
  </g>
</svg>
