<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="none" stroke="#000" stroke-width="1.6">
  <rect x="0" y="0" width="1123" height="794" fill="#fff" stroke="none"/>

  <text x="30" y="34" font-size="20" font-weight="bold" fill="#000" stroke="none">LE-01 · Sheet 2/2 · BRAIDED ATTACHMENT — FULL SIZE 1:1 · A4 landscape · v2.0 · 18 Sep 2026</text>
  <text x="30" y="56" font-size="12.5" fill="#000" stroke="none">Print at 100% / "actual size", no page scaling. CHECK THE CONTROL BAR AT THE BOTTOM: it must measure exactly 100 mm. Same attachment at all 5 positions.</text>

  <!-- ============ 1 · BLANK WITH FOLD LINE AND SLIT LAYOUT ============ -->
  <text x="30" y="92" font-size="14" font-weight="bold" fill="#000" stroke="none">1 · Blank — fold line and slit layout (slits are cut through BOTH layers after folding)</text>

  <!-- strap: width 20 mm = 75.6 px, top y=110 -->
  <rect x="30" y="110" width="1060" height="75.6" stroke-width="2.2"/>
  <!-- strand division lines (the two slits), 6.67 mm apart -->
  <g stroke-width="2" stroke-dasharray="0">
    <line x1="124" y1="135.2" x2="559" y2="135.2"/>
    <line x1="124" y1="160.4" x2="559" y2="160.4"/>
    <line x1="635" y1="135.2" x2="1070" y2="135.2"/>
    <line x1="635" y1="160.4" x2="1070" y2="160.4"/>
  </g>
  <!-- fold line -->
  <g stroke-dasharray="10 5" stroke-width="1.6">
    <line x1="597" y1="102" x2="597" y2="196"/>
  </g>
  <text x="597" y="204" text-anchor="middle" fill="#000" stroke="none" font-size="12" font-weight="bold">FOLD — goes through ring / hook eye</text>

  <g stroke-width="1.1">
    <line x1="30" y1="240" x2="597" y2="240"/>
    <path d="M 30 240 l 8 -4 v 8 z" fill="#000"/><path d="M 597 240 l -8 -4 v 8 z" fill="#000"/>
    <text x="313" y="234" text-anchor="middle" fill="#000" stroke="none" font-size="12.5" font-weight="bold">fold-back 150 mm</text>

    <line x1="124" y1="266" x2="559" y2="266"/>
    <path d="M 124 266 l 8 -4 v 8 z" fill="#000"/><path d="M 559 266 l -8 -4 v 8 z" fill="#000"/>
    <text x="341" y="260" text-anchor="middle" fill="#000" stroke="none" font-size="12.5" font-weight="bold">slit 115 mm</text>

    <line x1="635" y1="266" x2="1070" y2="266"/>
    <path d="M 635 266 l 8 -4 v 8 z" fill="#000"/><path d="M 1070 266 l -8 -4 v 8 z" fill="#000"/>
    <text x="852" y="260" text-anchor="middle" fill="#000" stroke="none" font-size="12.5" font-weight="bold">slit 115 mm (mirrored)</text>

    <line x1="559" y1="288" x2="635" y2="288"/>
    <text x="597" y="304" text-anchor="middle" fill="#000" stroke="none" font-size="12">2 × 10 mm uncut at the fold</text>

    <!-- strap width -->
    <line x1="1102" y1="110" x2="1102" y2="185.6"/>
    <line x1="1096" y1="110" x2="1108" y2="110"/><line x1="1096" y1="185.6" x2="1108" y2="185.6"/>
    <text x="1096" y="105" text-anchor="end" fill="#000" stroke="none" font-size="12">20 mm</text>
  </g>
  <text x="30" y="320" fill="#000" stroke="none" font-size="12.5">Two lengthwise slits divide the 20 mm strap into 3 strands of 6.7 mm. Slits straight and clean-cut, ends rounded with a 2 mm punch so they cannot tear.</text>
  <text x="30" y="336" fill="#000" stroke="none" font-size="12.5">The strands stay attached at both ends — the strap is never cut through ("mystery braid" / trick braid, made from one piece).</text>

  <!-- ============ 2 · FINISHED ATTACHMENT ============ -->
  <text x="30" y="366" font-size="14" font-weight="bold" fill="#000" stroke="none">2 · Finished attachment, full size — shown with ring 1 / ring 2 (outer Ø 30 mm)</text>

  <!-- ring: outer 30 mm = 113.4 px -> r 56.7, wire 5 mm = 18.9 -->
  <circle cx="105" cy="444" r="56.7" stroke-width="2.5"/>
  <circle cx="105" cy="444" r="37.8" stroke-width="1.6"/>

  <!-- strap doubled, 20 mm wide; open on the ring side -->
  <g stroke-width="2.2">
    <line x1="105" y1="406.2" x2="1090" y2="406.2"/>
    <line x1="105" y1="481.8" x2="1090" y2="481.8"/>
    <line x1="1090" y1="406.2" x2="1090" y2="481.8"/>
  </g>
  <!-- braid 115 mm = 434.6 px, from x=162 to x=596, 10 chevrons of 43.5 -->
  <g stroke-width="1.5">
    <path d="M 162 406.2 l 21.7 75.6 l 21.8 -75.6 l 21.7 75.6 l 21.8 -75.6 l 21.7 75.6 l 21.8 -75.6 l 21.7 75.6 l 21.8 -75.6 l 21.7 75.6 l 21.8 -75.6 l 21.7 75.6 l 21.8 -75.6 l 21.7 75.6 l 21.8 -75.6 l 21.7 75.6 l 21.8 -75.6 l 21.7 75.6 l 21.8 -75.6 l 21.7 75.6 l 21.8 -75.6"/>
    <path d="M 162 481.8 l 21.7 -75.6 l 21.8 75.6 l 21.7 -75.6 l 21.8 75.6 l 21.7 -75.6 l 21.8 75.6 l 21.7 -75.6 l 21.8 75.6 l 21.7 -75.6 l 21.8 75.6 l 21.7 -75.6 l 21.8 75.6 l 21.7 -75.6 l 21.8 75.6 l 21.7 -75.6 l 21.8 75.6 l 21.7 -75.6 l 21.8 75.6 l 21.7 -75.6 l 21.8 75.6"/>
  </g>
  <!-- end of the free layer, flat on the inside -->
  <g stroke-dasharray="6 4" stroke-width="1.3">
    <line x1="672" y1="406.2" x2="672" y2="481.8"/>
  </g>
  <!-- chicago screw head 9 mm = 34 px -->
  <circle cx="634" cy="444" r="17" stroke-width="1.8"/>
  <line x1="623" y1="444" x2="645" y2="444" stroke-width="1.8"/>

  <g stroke-width="1.1">
    <line x1="162" y1="518" x2="596" y2="518"/>
    <path d="M 162 518 l 8 -4 v 8 z" fill="#000"/><path d="M 596 518 l -8 -4 v 8 z" fill="#000"/>
    <text x="379" y="512" text-anchor="middle" fill="#000" stroke="none" font-size="12.5" font-weight="bold">braid 115 mm — 9 to 10 crossings, chevron "V" pattern, tight and even</text>

    <line x1="596" y1="544" x2="634" y2="544"/>
    <path d="M 596 544 l 8 -4 v 8 z" fill="#000"/><path d="M 634 544 l -8 -4 v 8 z" fill="#000"/>
    <text x="646" y="549" fill="#000" stroke="none" font-size="12.5">10 mm to the Chicago screw. Free end ends 20 mm after it (dashed),</text>
    <text x="646" y="566" fill="#000" stroke="none" font-size="12.5">flat on the inside, edge bevelled.</text>

    <line x1="48.3" y1="444" x2="161.7" y2="444" stroke-dasharray="4 3"/>
    <text x="105" y="526" text-anchor="middle" fill="#000" stroke="none" font-size="12">Ø 30 mm</text>
  </g>

  <text x="30" y="592" fill="#000" stroke="none" font-size="12.5">Ring 3 (at hook B) is the same construction with an outer Ø 40 mm ring; the hook eye is caught in the SAME fold, 30 mm beyond the ring centre (sheet 1, detail A).</text>
  <text x="30" y="607" fill="#000" stroke="none" font-size="12.5">Screw heads always on the grain side, one screw per attachment, thread-locked. The braid carries the load, the screw only stops the free end lifting.</text>
  <text x="30" y="622" fill="#000" stroke="none" font-size="12.5" font-weight="bold">The sample has a KNOTTED ring at ring 1 and ring 2. This is replaced: all five attachments are braided as drawn. No knots anywhere on the lead.</text>

  <!-- ============ 3 · SECTION + CONTROL BAR ============ -->
  <g transform="translate(30,656)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#000" stroke="none">3 · Section through the braid (full size)</text>
    <!-- two layers, each 3.5-4 mm = 13-15 px -->
    <rect x="0" y="16" width="240" height="14.2" stroke-width="1.8" fill="#eee"/>
    <rect x="0" y="30.2" width="240" height="14.2" stroke-width="1.8" fill="#fff"/>
    <text x="252" y="28" fill="#000" stroke="none" font-size="12">free end, grain side down</text>
    <text x="252" y="44" fill="#000" stroke="none" font-size="12">standing part, grain side up</text>
    <g stroke-width="1.1">
      <line x1="-14" y1="16" x2="-14" y2="44.4"/>
      <line x1="-20" y1="16" x2="-8" y2="16"/><line x1="-20" y1="44.4" x2="-8" y2="44.4"/>
    </g>
    <text x="0" y="68" fill="#000" stroke="none" font-size="12">2 layers × 3.5–4.0 mm = 7–8 mm total thickness in the braided zone. Chicago screw post length 8 mm.</text>
  </g>

  <g transform="translate(600,656)">
    <text x="0" y="-6" font-size="12.5" font-weight="bold" fill="#000" stroke="none">CONTROL BAR — must measure exactly 100 mm on the print:</text>
    <text x="0" y="58" font-size="12" fill="#000" stroke="none">If it does not, the print is scaled — do not use it as a template.</text>
    <rect x="0" y="6" width="377.95" height="14" stroke-width="1.6"/>
    <g stroke-width="1.2">
      <line x1="37.8" y1="6" x2="37.8" y2="20"/><line x1="75.6" y1="6" x2="75.6" y2="20"/>
      <line x1="113.4" y1="6" x2="113.4" y2="20"/><line x1="151.2" y1="6" x2="151.2" y2="20"/>
      <line x1="189" y1="2" x2="189" y2="24"/>
      <line x1="226.8" y1="6" x2="226.8" y2="20"/><line x1="264.6" y1="6" x2="264.6" y2="20"/>
      <line x1="302.4" y1="6" x2="302.4" y2="20"/><line x1="340.2" y1="6" x2="340.2" y2="20"/>
    </g>
    <text x="0" y="38" fill="#000" stroke="none" font-size="11">0</text>
    <text x="189" y="38" text-anchor="middle" fill="#000" stroke="none" font-size="11">50</text>
    <text x="377.95" y="38" text-anchor="middle" fill="#000" stroke="none" font-size="11">100 mm</text>
  </g>
</svg>
