  <text x="40" y="40" font-size="26" font-weight="bold" fill="#000" stroke="none">RC-01 Rain Cape, waxed cotton — pattern pieces, base size L/XL — Bellowerk Manufaktur, v1.0, 17 Sep 2026</text>
  <text x="40" y="66" fill="#000" stroke="none">Waxed cotton 380–420 g/m² · kimono cut, no shoulder seam, no set-in sleeve · full front opening, 7 solid brass ring snaps behind storm flap · attached hood · sleeve underseam = snap placket</text>
  <text x="40" y="88" fill="#000" stroke="none" font-size="14">All dimensions in mm. Drawing 1 px = 2 mm. NET lines — seam allowance NOT included: add 10 mm all seams, 40 mm hem and cuff, 20 mm hood face edge.</text>

  <!-- ============ BACK ============ -->
  <g transform="translate(70,160)">
    <path d="M 0,465 L 0,10 C 0,4 20,0 47.5,0 L 367.5,129 L 315,259 C 260,235 190,200 145,160 C 155,270 195,380 215,465 C 150,472 70,470 0,465 Z" fill="#f4f4f4" stroke="#000"/>
    <line x1="0" y1="10" x2="0" y2="465" stroke="#000" stroke-width="3" stroke-dasharray="14 6 3 6"/>
    <text x="10" y="260" fill="#000" stroke="none" font-size="14" transform="rotate(90,10,260)" text-anchor="middle">CENTRE BACK — CUT 1 ON FOLD</text>
    <text x="150" y="62" fill="#000" stroke="none" font-size="22" font-weight="bold">BACK</text>
    <text x="150" y="84" fill="#000" stroke="none" font-size="13">cut 1 on fold · shell</text>
    <text x="150" y="104" fill="#000" stroke="none" font-size="13">grain line ∥ centre back</text>
    <line x1="150" y1="116" x2="150" y2="186" stroke="#000" stroke-width="1.5" marker-start="url(#b)" marker-end="url(#a)"/>

    <text x="196" y="36" fill="#000" stroke="none" font-size="13">upper sleeve edge 690</text>
    <text x="272" y="200" fill="#000" stroke="none" font-size="13">cuff 280</text>
    <text x="172" y="248" fill="#000" stroke="none" font-size="13">underseam 393</text>
    <text x="24" y="150" fill="#000" stroke="none" font-size="12">underarm 290 / 320 · R 60 · bartack</text>
    <circle cx="145" cy="160" r="4" fill="#000" stroke="none"/>
    <text x="48" y="336" fill="#000" stroke="none" font-size="13">side seam 626</text>
    <text x="18" y="-8" fill="#000" stroke="none" font-size="13">neck: half width 95, drop 20</text>

    <line x1="0" y1="-30" x2="367.5" y2="-30" stroke="#000" stroke-width="1" marker-start="url(#b)" marker-end="url(#a)"/>
    <line x1="367.5" y1="-30" x2="367.5" y2="125" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
    <text x="124" y="-36" fill="#000" stroke="none" font-size="14">735 half span, CB → cuff</text>

    <line x1="-26" y1="10" x2="-26" y2="465" stroke="#000" stroke-width="1" marker-start="url(#b)" marker-end="url(#a)"/>
    <text x="-30" y="240" fill="#000" stroke="none" font-size="14" transform="rotate(-90,-30,240)" text-anchor="middle">930 centre-back length</text>

    <line x1="0" y1="492" x2="215" y2="492" stroke="#000" stroke-width="1" marker-start="url(#b)" marker-end="url(#a)"/>
    <line x1="215" y1="468" x2="215" y2="495" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
    <text x="56" y="510" fill="#000" stroke="none" font-size="14">430 half hem</text>
  </g>

  <!-- ============ FRONT ============ -->
