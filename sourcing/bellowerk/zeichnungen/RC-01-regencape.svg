    <path d="M -30,45 L 0,45 C 2,25 18,6 47.5,0 L 367.5,129 L 315,259 C 260,235 190,200 145,160 C 155,270 195,380 215,465 C 150,472 70,470 0,465 L -30,465 Z" fill="#f4f4f4" stroke="#000"/>
    <line x1="0" y1="45" x2="0" y2="465" stroke="#000" stroke-width="1.2" stroke-dasharray="8 5"/>
    <text x="150" y="62" fill="#000" stroke="none" font-size="22" font-weight="bold">FRONT</text>
    <text x="150" y="84" fill="#000" stroke="none" font-size="13">cut 2 mirrored · shell</text>
    <text x="150" y="104" fill="#000" stroke="none" font-size="13">grain line ∥ centre front</text>
    <line x1="150" y1="116" x2="150" y2="186" stroke="#000" stroke-width="1.5" marker-start="url(#b)" marker-end="url(#a)"/>

    <text x="-98" y="250" fill="#000" stroke="none" font-size="13" transform="rotate(-90,-98,250)" text-anchor="middle">CF · placket ext. 60 (fold 30+30)</text>
    <text x="22" y="36" fill="#000" stroke="none" font-size="13">neck drop 90</text>
    <text x="196" y="22" fill="#000" stroke="none" font-size="13">upper sleeve edge 690</text>
    <text x="168" y="248" fill="#000" stroke="none" font-size="13">snap placket: 3 snaps</text>
    <circle cx="145" cy="160" r="4" fill="#000" stroke="none"/>

    <circle cx="-15" cy="52" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="-15" cy="112" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="-15" cy="172" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="-15" cy="232" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="-15" cy="292" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="-15" cy="352" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="-30" y="502" fill="#000" stroke="none" font-size="13">7 brass snaps Ø15, pitch 120 — behind storm flap</text>

    <rect x="40" y="130" width="110" height="120" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="7 4"/>
    <text x="38" y="272" fill="#000" stroke="none" font-size="12">chest pocket, LEFT front only</text>
    <text x="38" y="290" fill="#000" stroke="none" font-size="12">inner edge 80 from placket fold, top edge 260 below neck line</text>

    <line x1="330" y1="133" x2="340" y2="175" stroke="#000" stroke-width="3"/>
    <text x="238" y="152" fill="#000" stroke="none" font-size="12">forearm tab, 120 before cuff</text>
  </g>

  <!-- ============ HOOD ============ -->
  <g transform="translate(1060,170)">
    <path d="M 0,200 L 0,0 C 120,-15 210,80 117.5,200 Z" fill="#f4f4f4" stroke="#000"/>
    <line x1="10" y1="0" x2="10" y2="196" stroke="#000" stroke-width="1.2" stroke-dasharray="7 4"/>
    <text x="16" y="102" fill="#000" stroke="none" font-size="12">20 face hem + facing</text>
    <text x="0" y="-32" fill="#000" stroke="none" font-size="18" font-weight="bold">HOOD SIDE</text>
    <text x="0" y="-14" fill="#000" stroke="none" font-size="12">cut 2 mirrored · shell</text>
    <text x="-6" y="224" fill="#000" stroke="none" font-size="13">neck edge 235</text>
    <text x="172" y="48" fill="#000" stroke="none" font-size="12">crown seam ≈ 560</text>
    <text x="172" y="66" fill="#000" stroke="none" font-size="12">(flat-felled)</text>
    <text x="-32" y="105" fill="#000" stroke="none" font-size="13" transform="rotate(-90,-32,105)" text-anchor="middle">face opening 400</text>
    <circle cx="16" cy="178" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="16" cy="138" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="26" y="166" fill="#000" stroke="none" font-size="11">2 brass eyelets Ø6, drawcord</text>
  </g>

  <!-- ============ COLLAR ============ -->
  <g transform="translate(1060,480)">
    <path d="M 0,6 C 90,0 205,0 295,6 L 295,46 C 205,40 90,40 0,46 Z" fill="#f4f4f4" stroke="#000"/>
    <line x1="147.5" y1="2" x2="147.5" y2="43" stroke="#000" stroke-width="1.2" stroke-dasharray="7 4"/>
    <text x="0" y="-42" fill="#000" stroke="none" font-size="18" font-weight="bold">COLLAR STAND</text>
    <text x="0" y="-24" fill="#000" stroke="none" font-size="12">cut 2: 1 shell (outer) + 1 corduroy/check (inner) + 1 interlining</text>
    <text x="0" y="68" fill="#000" stroke="none" font-size="13">length 590 finished · height 80</text>
    <text x="152" y="32" fill="#000" stroke="none" font-size="11">CB</text>
    <circle cx="14" cy="26" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="26" y="20" fill="#000" stroke="none" font-size="11">throat snap</text>
  </g>

  <!-- ============ POCKET ============ -->
  <g transform="translate(1060,590)">
    <path d="M 0,0 L 110,0 L 110,102 A 18 18 0 0 1 92,120 L 18,120 A 18 18 0 0 1 0,102 Z" fill="#f4f4f4" stroke="#000"/>
    <line x1="0" y1="20" x2="110" y2="20" stroke="#000" stroke-width="1.2" stroke-dasharray="7 4"/>
    <text x="0" y="-24" fill="#000" stroke="none" font-size="18" font-weight="bold">CHEST POCKET</text>
    <text x="0" y="-8" fill="#000" stroke="none" font-size="12">cut 1 · shell · 220 × 240</text>
    <text x="6" y="36" fill="#000" stroke="none" font-size="11">40 top fold</text>
    <text x="0" y="142" fill="#000" stroke="none" font-size="12">corners bartacked</text>
  </g>

  <!-- ============ FLAP ============ -->
  <g transform="translate(1240,590)">
    <path d="M 0,0 L 120,0 L 120,26 A 14 14 0 0 1 106,40 L 14,40 A 14 14 0 0 1 0,26 Z" fill="#f4f4f4" stroke="#000"/>
    <circle cx="60" cy="24" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="0" y="-24" fill="#000" stroke="none" font-size="18" font-weight="bold">POCKET FLAP</text>
    <text x="0" y="-8" fill="#000" stroke="none" font-size="12">cut 2 · 240 × 80 · 1 snap</text>
  </g>

  <!-- ============ FOREARM TAB ============ -->
  <g transform="translate(1240,670)">
    <path d="M 0,0 L 78,0 A 12 12 0 0 1 90,12 A 12 12 0 0 1 78,25 L 0,25 Z" fill="#f4f4f4" stroke="#000"/>
    <circle cx="70" cy="12.5" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="50" cy="12.5" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="0" y="-24" fill="#000" stroke="none" font-size="18" font-weight="bold">FOREARM TAB</text>
    <text x="0" y="-8" fill="#000" stroke="none" font-size="12">cut 4 (2 tabs × 2 layers) · 180 × 50</text>
    <text x="0" y="46" fill="#000" stroke="none" font-size="11">2 snaps, pitch 40 = sleeve width adjustment</text>
    <text x="0" y="62" fill="#000" stroke="none" font-size="11">PATCH-01 patch on the LEFT tab</text>
  </g>

  <!-- ============ SIZE TABLE ============ -->
  <g transform="translate(1460,160)" fill="#000" stroke="none">
    <text x="0" y="0" font-size="18" font-weight="bold">Sizes (mm)</text>
    <line x1="0" y1="10" x2="490" y2="10" stroke="#000" stroke-width="1"/>
    <text x="0" y="30" font-size="13" font-weight="bold">Measurement</text>
    <text x="300" y="30" font-size="13" font-weight="bold">S/M</text>
    <text x="378" y="30" font-size="13" font-weight="bold">L/XL</text>
    <text x="448" y="30" font-size="13" font-weight="bold">XXL</text>
    <line x1="0" y1="38" x2="490" y2="38" stroke="#000" stroke-width="1"/>
    <text x="0" y="58" font-size="13">Centre-back length</text><text x="300" y="58" font-size="13">880</text><text x="378" y="58" font-size="13" font-weight="bold">930</text><text x="448" y="58" font-size="13">980</text>
    <text x="0" y="78" font-size="13">Half span CB → cuff</text><text x="300" y="78" font-size="13">695</text><text x="378" y="78" font-size="13" font-weight="bold">735</text><text x="448" y="78" font-size="13">775</text>
    <text x="0" y="98" font-size="13">Full sleeve span</text><text x="300" y="98" font-size="13">1390</text><text x="378" y="98" font-size="13" font-weight="bold">1470</text><text x="448" y="98" font-size="13">1550</text>
    <text x="0" y="118" font-size="13">Cuff opening</text><text x="300" y="118" font-size="13">260</text><text x="378" y="118" font-size="13" font-weight="bold">280</text><text x="448" y="118" font-size="13">300</text>
    <text x="0" y="138" font-size="13">Neck half width</text><text x="300" y="138" font-size="13">90</text><text x="378" y="138" font-size="13" font-weight="bold">95</text><text x="448" y="138" font-size="13">100</text>
    <text x="0" y="158" font-size="13">Neck drop back / front</text><text x="300" y="158" font-size="13">20/85</text><text x="378" y="158" font-size="13" font-weight="bold">20/90</text><text x="448" y="158" font-size="13">20/95</text>
    <text x="0" y="178" font-size="13">Underarm from CB / down</text><text x="300" y="178" font-size="13">270/310</text><text x="378" y="178" font-size="13" font-weight="bold">290/320</text><text x="448" y="178" font-size="13">310/330</text>
    <text x="0" y="198" font-size="13">Half hem width per panel</text><text x="300" y="198" font-size="13">400</text><text x="378" y="198" font-size="13" font-weight="bold">430</text><text x="448" y="198" font-size="13">460</text>
    <text x="0" y="218" font-size="13">Hem circumference finished</text><text x="300" y="218" font-size="13">1600</text><text x="378" y="218" font-size="13" font-weight="bold">1720</text><text x="448" y="218" font-size="13">1840</text>
    <text x="0" y="238" font-size="13">Collar length finished</text><text x="300" y="238" font-size="13">560</text><text x="378" y="238" font-size="13" font-weight="bold">590</text><text x="448" y="238" font-size="13">620</text>
    <text x="0" y="258" font-size="13">Hood height × neck edge</text><text x="300" y="258" font-size="13">385×225</text><text x="378" y="258" font-size="13" font-weight="bold">400×235</text><text x="448" y="258" font-size="13">415×245</text>
    <line x1="0" y1="268" x2="490" y2="268" stroke="#000" stroke-width="1"/>
    <text x="0" y="288" font-size="12">Tolerance: length ±10, width ±5, collar ±5. Drawing shows L/XL.</text>

    <text x="0" y="336" font-size="18" font-weight="bold">Cut list per cape</text>
    <line x1="0" y1="346" x2="490" y2="346" stroke="#000" stroke-width="1"/>
    <text x="0" y="366" font-size="13">1 Back — 1 on fold — shell</text>
    <text x="0" y="386" font-size="13">2 Front — 2 mirrored — shell (incl. 60 placket ext.)</text>
    <text x="0" y="406" font-size="13">3 Hood side — 2 mirrored — shell</text>
    <text x="0" y="426" font-size="13">4 Collar stand — 2 — shell + corduroy/check (+1 interlining)</text>
    <text x="0" y="446" font-size="13">5 Chest pocket — 1 — shell — 220 × 240</text>
    <text x="0" y="466" font-size="13">6 Pocket flap — 2 — shell — 240 × 80</text>
    <text x="0" y="486" font-size="13">7 Forearm tab — 4 — shell — 180 × 50</text>
    <text x="0" y="506" font-size="13">8 Storm flap (under-placket) — 1 — shell — 80 × 930</text>
    <text x="0" y="526" font-size="13">9 Hood face facing — 2 — shell — 60 × 400</text>
    <text x="0" y="546" font-size="13">10 Hanger loop — 1 — shell — 30 × 120</text>
    <line x1="0" y1="558" x2="490" y2="558" stroke="#000" stroke-width="1"/>
    <text x="0" y="578" font-size="13">Hardware: 7 front + 1 throat + 6 sleeve + 2 tab</text>
    <text x="0" y="596" font-size="13">= 16 brass ring snaps Ø15 · 2 brass eyelets Ø6</text>
    <text x="0" y="614" font-size="13">1 waxed cord 1400 · 1 leather patch PATCH-01</text>
  </g>

  <!-- ============ NOTES ============ -->
  <g transform="translate(70,790)" fill="#000" stroke="none">
    <text x="0" y="0" font-size="18" font-weight="bold">Construction notes</text>
    <line x1="0" y1="10" x2="1200" y2="10" stroke="#000" stroke-width="1"/>
    <text x="0" y="32" font-size="14">1 · Upper sleeve edge (neck point → cuff) joins front and back: FLAT-FELLED seam 10 mm, two rows of topstitch. No overlock, no raw edge anywhere — waxed cotton frays and wicks water.</text>
    <text x="0" y="56" font-size="14">2 · Side seam underarm → hem: flat-felled. Underarm corner rounded R 60 and BARTACKED — this is the load point of the whole cape.</text>
    <text x="0" y="80" font-size="14">3 · Sleeve underseam is NOT sewn: both edges get a 30 mm turned facing and 3 brass snaps at 60 / 160 / 300 mm from the underarm corner. Closed = sleeve, open = cape.</text>
    <text x="20" y="104" font-size="14">Variant B (Björn decides): sew this seam closed up to 200 mm before the cuff and keep only the last 2 snaps. Same pattern pieces either way.</text>
    <text x="0" y="128" font-size="14">4 · Centre front: fold the 60 mm extension back twice (30 + 30) as self-facing, topstitch. 7 snaps — first in the collar stand, then pitch 120 mm. Storm flap inside the right front.</text>
    <text x="0" y="152" font-size="14">5 · Hood sewn into the neck seam, collar stand sewn over it so the collar stands with the hood up or down. Hood face edge 20 mm double turn, 2 brass eyelets, waxed drawcord.</text>
    <text x="0" y="176" font-size="14">6 · Waxed cotton: NO PINS (holes stay) — clips only. Needle 100/16–110/18 jeans point, stitch length 3.5 mm, PTFE or roller foot, polyester core-spun Tex 60 topstitch. No hot iron — the wax melts.</text>
    <text x="0" y="200" font-size="14">7 · Hardware: solid brass ring-spring snaps, unlacquered, pull-off ≥ 40 N. NOT nickel, NOT zinc alloy, NOT plated steel. Patina is wanted.</text>
  </g>
</svg>
