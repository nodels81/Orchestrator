<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1100" viewBox="0 0 2000 1100" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="none" stroke="#000" stroke-width="2">
  <rect x="0" y="0" width="2000" height="1100" fill="#fff" stroke="none"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#000" stroke="none"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,3 L8,6 z" fill="#000" stroke="none"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="26" font-weight="bold" fill="#000" stroke="none">RC-01 Rain Cape (poncho), waxed cotton — pattern pieces, base size L/XL — Bellowerk Manufaktur, v2.0, 17 Sep 2026</text>
  <text x="40" y="66" fill="#000" stroke="none">Two panels only, joined by ONE shoulder seam · goes over the head — NO front opening, NO placket, NO sleeves · sides open from the shoulder down, arms come out there · forearm snap tabs</text>
  <text x="40" y="88" fill="#000" stroke="none" font-size="14">All dimensions in mm. Drawing 1 px = 2 mm. NET lines — seam allowance NOT included: add 10 mm shoulder and neck seam, 40 mm hem, 20 mm open side edges and hood face edge.</text>

  <!-- ============ FRONT PANEL ============ -->
  <g transform="translate(100,180)">
    <path d="M 0,440 L 0,55 C 2,30 25,6 65,0 L 270.5,43.5 C 285,140 300,300 310,440 C 220,450 100,448 0,440 Z" fill="#f4f4f4" stroke="#000"/>
    <line x1="0" y1="55" x2="0" y2="440" stroke="#000" stroke-width="3" stroke-dasharray="14 6 3 6"/>
    <text x="10" y="250" fill="#000" stroke="none" font-size="14" transform="rotate(90,10,250)" text-anchor="middle">CENTRE FRONT — CUT 1 ON FOLD</text>
    <text x="110" y="120" fill="#000" stroke="none" font-size="22" font-weight="bold">FRONT PANEL</text>
    <text x="110" y="142" fill="#000" stroke="none" font-size="13">cut 1 on fold · shell</text>
    <text x="110" y="162" fill="#000" stroke="none" font-size="13">grain line ∥ centre front</text>
    <line x1="110" y1="174" x2="110" y2="234" stroke="#000" stroke-width="1.5" marker-start="url(#b)" marker-end="url(#a)"/>

    <text x="18" y="-8" fill="#000" stroke="none" font-size="13">neck: half width 130, drop 110</text>
    <text x="96" y="24" fill="#000" stroke="none" font-size="13">shoulder seam 420, slope 12°</text>
    <circle cx="270.5" cy="43.5" r="4" fill="#000" stroke="none"/>
    <text x="146" y="60" fill="#000" stroke="none" font-size="12">seam end: R 40 + BARTACK (load point)</text>

    <text x="320" y="250" fill="#000" stroke="none" font-size="13" transform="rotate(90,320,250)" text-anchor="middle">OPEN SIDE EDGE 797 — 20 mm turn, not sewn</text>

    <line x1="274" y1="180" x2="298" y2="176" stroke="#000" stroke-width="4"/>
    <text x="120" y="196" fill="#000" stroke="none" font-size="12">forearm tab, 300 from seam end</text>

    <path d="M 0,150 L 55,150 L 55,270 L 0,270" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="7 4"/>
    <text x="64" y="206" fill="#000" stroke="none" font-size="12">chest pocket — HALF shown:</text>
    <text x="64" y="222" fill="#000" stroke="none" font-size="12">220 wide, CENTRED on the fold,</text>
    <text x="64" y="238" fill="#000" stroke="none" font-size="12">top edge 300 below neck seam</text>

    <line x1="-26" y1="55" x2="-26" y2="440" stroke="#000" stroke-width="1" marker-start="url(#b)" marker-end="url(#a)"/>
    <text x="-30" y="248" fill="#000" stroke="none" font-size="14" transform="rotate(-90,-30,248)" text-anchor="middle">880 centre-front length</text>
    <line x1="0" y1="474" x2="310" y2="474" stroke="#000" stroke-width="1" marker-start="url(#b)" marker-end="url(#a)"/>
    <line x1="310" y1="446" x2="310" y2="477" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
    <text x="90" y="492" fill="#000" stroke="none" font-size="14">620 half hem</text>
  </g>

  <!-- ============ BACK PANEL ============ -->
  <g transform="translate(580,180)">
    <path d="M 0,465 L 0,20 C 2,10 25,3 65,0 L 270.5,43.5 C 285,150 300,320 310,465 C 220,475 100,473 0,465 Z" fill="#f4f4f4" stroke="#000"/>
    <line x1="0" y1="20" x2="0" y2="465" stroke="#000" stroke-width="3" stroke-dasharray="14 6 3 6"/>
    <text x="10" y="260" fill="#000" stroke="none" font-size="14" transform="rotate(90,10,260)" text-anchor="middle">CENTRE BACK — CUT 1 ON FOLD</text>
    <text x="110" y="130" fill="#000" stroke="none" font-size="22" font-weight="bold">BACK PANEL</text>
    <text x="110" y="152" fill="#000" stroke="none" font-size="13">cut 1 on fold · shell</text>
    <text x="110" y="172" fill="#000" stroke="none" font-size="13">grain line ∥ centre back</text>
    <line x1="110" y1="184" x2="110" y2="244" stroke="#000" stroke-width="1.5" marker-start="url(#b)" marker-end="url(#a)"/>

    <text x="18" y="-8" fill="#000" stroke="none" font-size="13">neck: half width 130, drop 40</text>
    <text x="96" y="24" fill="#000" stroke="none" font-size="13">shoulder seam 420, slope 12°</text>
    <circle cx="270.5" cy="43.5" r="4" fill="#000" stroke="none"/>
    <text x="320" y="262" fill="#000" stroke="none" font-size="13" transform="rotate(90,320,262)" text-anchor="middle">OPEN SIDE EDGE 847 — 20 mm turn, not sewn</text>

    <line x1="274" y1="180" x2="298" y2="176" stroke="#000" stroke-width="4"/>
    <text x="100" y="196" fill="#000" stroke="none" font-size="12">counter sockets, 300 from seam end</text>

    <text x="36" y="336" fill="#000" stroke="none" font-size="13">back is 50 longer than the front</text>
    <text x="36" y="354" fill="#000" stroke="none" font-size="12">(stays level over a rucksack)</text>

    <line x1="-26" y1="20" x2="-26" y2="465" stroke="#000" stroke-width="1" marker-start="url(#b)" marker-end="url(#a)"/>
    <text x="-30" y="250" fill="#000" stroke="none" font-size="14" transform="rotate(-90,-30,250)" text-anchor="middle">930 centre-back length</text>
    <line x1="0" y1="500" x2="310" y2="500" stroke="#000" stroke-width="1" marker-start="url(#b)" marker-end="url(#a)"/>
    <line x1="310" y1="472" x2="310" y2="503" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
    <text x="90" y="518" fill="#000" stroke="none" font-size="14">620 half hem</text>
  </g>

  <!-- ============ HOOD ============ -->
  <g transform="translate(1050,200)">
    <path d="M 0,210 L 0,0 C 130,-16 225,85 160,210 Z" fill="#f4f4f4" stroke="#000"/>
    <line x1="10" y1="0" x2="10" y2="206" stroke="#000" stroke-width="1.2" stroke-dasharray="7 4"/>
    <text x="16" y="100" fill="#000" stroke="none" font-size="12">20 face hem + facing</text>
    <text x="0" y="-32" fill="#000" stroke="none" font-size="18" font-weight="bold">HOOD SIDE</text>
    <text x="0" y="-14" fill="#000" stroke="none" font-size="12">cut 2 mirrored · shell</text>
    <text x="-6" y="234" fill="#000" stroke="none" font-size="13">neck edge 320 per side</text>
    <text x="200" y="52" fill="#000" stroke="none" font-size="12">crown seam ≈ 600</text>
    <text x="200" y="70" fill="#000" stroke="none" font-size="12">(flat-felled)</text>
    <text x="-32" y="110" fill="#000" stroke="none" font-size="13" transform="rotate(-90,-32,110)" text-anchor="middle">face opening 420</text>
    <circle cx="16" cy="188" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="16" cy="148" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="26" y="176" fill="#000" stroke="none" font-size="11">2 brass eyelets Ø6, drawcord</text>
  </g>

  <!-- ============ COLLAR ============ -->
  <g transform="translate(1050,520)">
    <path d="M 0,6 C 100,0 220,0 320,6 L 320,51 C 220,45 100,45 0,51 Z" fill="#f4f4f4" stroke="#000"/>
    <line x1="160" y1="2" x2="160" y2="48" stroke="#000" stroke-width="1.2" stroke-dasharray="7 4"/>
    <text x="0" y="-42" fill="#000" stroke="none" font-size="18" font-weight="bold">COLLAR STAND (funnel)</text>
    <text x="0" y="-24" fill="#000" stroke="none" font-size="12">cut 2: 1 shell (outer) + 1 corduroy/check (inner) + 1 interlining</text>
    <text x="0" y="76" fill="#000" stroke="none" font-size="13">640 finished = neck opening · height 90</text>
    <text x="164" y="34" fill="#000" stroke="none" font-size="11">CB</text>
    <circle cx="16" cy="28" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="28" y="22" fill="#000" stroke="none" font-size="11">1 throat snap — NOT a placket</text>
  </g>

  <!-- ============ POCKET ============ -->
  <g transform="translate(1050,650)">
    <path d="M 0,0 L 110,0 L 110,102 A 18 18 0 0 1 92,120 L 18,120 A 18 18 0 0 1 0,102 Z" fill="#f4f4f4" stroke="#000"/>
    <line x1="0" y1="20" x2="110" y2="20" stroke="#000" stroke-width="1.2" stroke-dasharray="7 4"/>
    <text x="0" y="-24" fill="#000" stroke="none" font-size="18" font-weight="bold">CHEST POCKET</text>
    <text x="0" y="-8" fill="#000" stroke="none" font-size="12">cut 1 · shell · 220 × 240</text>
    <text x="6" y="36" fill="#000" stroke="none" font-size="11">40 top fold</text>
    <text x="0" y="142" fill="#000" stroke="none" font-size="12">corners bartacked</text>
  </g>

  <!-- ============ FLAP ============ -->
  <g transform="translate(1230,650)">
    <path d="M 0,0 L 120,0 L 120,26 A 14 14 0 0 1 106,40 L 14,40 A 14 14 0 0 1 0,26 Z" fill="#f4f4f4" stroke="#000"/>
    <circle cx="60" cy="24" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="0" y="-24" fill="#000" stroke="none" font-size="18" font-weight="bold">POCKET FLAP</text>
    <text x="0" y="-8" fill="#000" stroke="none" font-size="12">cut 2 · 240 × 80 · 1 snap</text>
  </g>

  <!-- ============ FOREARM TAB ============ -->
  <g transform="translate(1230,750)">
    <path d="M 0,0 L 78,0 A 12 12 0 0 1 90,12 A 12 12 0 0 1 78,25 L 0,25 Z" fill="#f4f4f4" stroke="#000"/>
    <circle cx="70" cy="12.5" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="50" cy="12.5" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="0" y="-24" fill="#000" stroke="none" font-size="18" font-weight="bold">FOREARM TAB</text>
    <text x="0" y="-8" fill="#000" stroke="none" font-size="12">cut 4 (2 tabs × 2 layers) · 180 × 50</text>
    <text x="0" y="46" fill="#000" stroke="none" font-size="11">on the FRONT side edge, sockets on the back</text>
    <text x="0" y="62" fill="#000" stroke="none" font-size="11">PATCH-01 patch on the LEFT tab</text>
  </g>

  <!-- ============ SIZE TABLE ============ -->
  <g transform="translate(1480,180)" fill="#000" stroke="none">
    <text x="0" y="0" font-size="18" font-weight="bold">Sizes (mm)</text>
    <line x1="0" y1="10" x2="480" y2="10" stroke="#000" stroke-width="1"/>
    <text x="0" y="30" font-size="13" font-weight="bold">Measurement</text>
    <text x="292" y="30" font-size="13" font-weight="bold">S/M</text>
    <text x="370" y="30" font-size="13" font-weight="bold">L/XL</text>
    <text x="440" y="30" font-size="13" font-weight="bold">XXL</text>
    <line x1="0" y1="38" x2="480" y2="38" stroke="#000" stroke-width="1"/>
    <text x="0" y="58" font-size="13">Centre-front length</text><text x="292" y="58" font-size="13">830</text><text x="370" y="58" font-size="13" font-weight="bold">880</text><text x="440" y="58" font-size="13">930</text>
    <text x="0" y="78" font-size="13">Centre-back length</text><text x="292" y="78" font-size="13">880</text><text x="370" y="78" font-size="13" font-weight="bold">930</text><text x="440" y="78" font-size="13">980</text>
    <text x="0" y="98" font-size="13">Neck opening, finished</text><text x="292" y="98" font-size="13">620</text><text x="370" y="98" font-size="13" font-weight="bold">640</text><text x="440" y="98" font-size="13">660</text>
    <text x="0" y="118" font-size="13">Neck half width</text><text x="292" y="118" font-size="13">125</text><text x="370" y="118" font-size="13" font-weight="bold">130</text><text x="440" y="118" font-size="13">135</text>
    <text x="0" y="138" font-size="13">Neck drop front / back</text><text x="292" y="138" font-size="13">105/38</text><text x="370" y="138" font-size="13" font-weight="bold">110/40</text><text x="440" y="138" font-size="13">115/42</text>
    <text x="0" y="158" font-size="13">Shoulder seam length</text><text x="292" y="158" font-size="13">400</text><text x="370" y="158" font-size="13" font-weight="bold">420</text><text x="440" y="158" font-size="13">440</text>
    <text x="0" y="178" font-size="13">Half hem width per panel</text><text x="292" y="178" font-size="13">580</text><text x="370" y="178" font-size="13" font-weight="bold">620</text><text x="440" y="178" font-size="13">660</text>
    <text x="0" y="198" font-size="13">Hem circumference finished</text><text x="292" y="198" font-size="13">2320</text><text x="370" y="198" font-size="13" font-weight="bold">2480</text><text x="440" y="198" font-size="13">2640</text>
    <text x="0" y="218" font-size="13">Open side edge front / back</text><text x="292" y="218" font-size="13">750/800</text><text x="370" y="218" font-size="13" font-weight="bold">797/847</text><text x="440" y="218" font-size="13">844/894</text>
    <text x="0" y="238" font-size="13">Forearm tab from seam end</text><text x="292" y="238" font-size="13">280</text><text x="370" y="238" font-size="13" font-weight="bold">300</text><text x="440" y="238" font-size="13">320</text>
    <text x="0" y="258" font-size="13">Collar height</text><text x="292" y="258" font-size="13">90</text><text x="370" y="258" font-size="13" font-weight="bold">90</text><text x="440" y="258" font-size="13">90</text>
    <text x="0" y="278" font-size="13">Hood height × neck edge</text><text x="292" y="278" font-size="13">405×305</text><text x="370" y="278" font-size="13" font-weight="bold">420×320</text><text x="440" y="278" font-size="13">435×335</text>
    <line x1="0" y1="288" x2="480" y2="288" stroke="#000" stroke-width="1"/>
    <text x="0" y="308" font-size="12">Tolerance: length ±10, width ±5, neck ±5. Drawing shows L/XL.</text>
    <text x="0" y="330" font-size="13" font-weight="bold">Never grade the neck opening below 620 finished —</text>
    <text x="0" y="348" font-size="13" font-weight="bold">there is no front opening, it must pass the head.</text>

    <text x="0" y="394" font-size="18" font-weight="bold">Cut list per cape — 9 pieces</text>
    <line x1="0" y1="404" x2="480" y2="404" stroke="#000" stroke-width="1"/>
    <text x="0" y="424" font-size="13">1 Front panel — 1 on fold — shell</text>
    <text x="0" y="444" font-size="13">2 Back panel — 1 on fold — shell (50 longer)</text>
    <text x="0" y="464" font-size="13">3 Hood side — 2 mirrored — shell</text>
    <text x="0" y="484" font-size="13">4 Collar stand — 2 — shell + corduroy/check (+1 interlining)</text>
    <text x="0" y="504" font-size="13">5 Chest pocket — 1 — shell — 220 × 240</text>
    <text x="0" y="524" font-size="13">6 Pocket flap — 2 — shell — 240 × 80</text>
    <text x="0" y="544" font-size="13">7 Forearm tab — 4 — shell — 180 × 50</text>
    <text x="0" y="564" font-size="13">8 Hood face facing — 2 — shell — 60 × 420</text>
    <text x="0" y="584" font-size="13">9 Hanger loop — 1 — shell — 30 × 120</text>
    <line x1="0" y1="596" x2="480" y2="596" stroke="#000" stroke-width="1"/>
    <text x="0" y="616" font-size="13">NO placket, NO storm flap, NO sleeve, NO front snaps.</text>
    <text x="0" y="636" font-size="13">Hardware: 1 throat + 1 pocket + 4 tab = 6 brass snaps Ø15,</text>
    <text x="0" y="654" font-size="13">2 brass eyelets Ø6, 1 waxed cord 1500, 1 patch PATCH-01</text>
  </g>

  <!-- ============ NOTES ============ -->
  <g transform="translate(100,840)" fill="#000" stroke="none">
    <text x="0" y="0" font-size="18" font-weight="bold">Construction notes</text>
    <line x1="0" y1="10" x2="1300" y2="10" stroke="#000" stroke-width="1"/>
    <text x="0" y="32" font-size="14">1 · ONE seam joins the two panels: the shoulder seam, from the neck point outward 420 mm at 12°. FLAT-FELLED 10 mm, two rows of topstitch. No overlock, no raw edge — waxed cotton frays and wicks.</text>
    <text x="0" y="56" font-size="14">2 · The end of the shoulder seam is the load point: round it R 40 and BARTACK. Everything below hangs from this corner.</text>
    <text x="0" y="80" font-size="14">3 · Side edges stay OPEN from that corner to the hem — 20 mm double turn, topstitched, nothing sewn together. This is where the arms come out. The turn must be even over the full 800 mm.</text>
    <text x="0" y="104" font-size="14">4 · Forearm tabs on the FRONT side edge 300 mm below the seam end, counter sockets on the back edge at the same height. 2 snaps per tab = loose or snug around the forearm.</text>
    <text x="0" y="128" font-size="14">5 · The cape goes OVER THE HEAD. No front opening, no placket, no snaps down the front. The single snap on the collar only draws the funnel closed in wind.</text>
    <text x="0" y="152" font-size="14">6 · Waxed cotton: NO PINS (holes stay) — clips only. Needle 100/16–110/18 jeans point, stitch length 3.5 mm, PTFE or roller foot, polyester core-spun Tex 60 topstitch. No hot iron — the wax melts.</text>
    <text x="0" y="176" font-size="14">7 · Hardware: solid brass ring-spring snaps, unlacquered, pull-off ≥ 40 N. NOT nickel, NOT zinc alloy, NOT plated steel. Patina is wanted.</text>
  </g>
</svg>
