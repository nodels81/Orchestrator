<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1230" viewBox="0 0 1900 1230" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="none" stroke="#000" stroke-width="2">
  <rect x="0" y="0" width="1900" height="1230" fill="#fff" stroke="none"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#000" stroke="none"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,3 L8,6 z" fill="#000" stroke="none"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="26" font-weight="bold" fill="#000" stroke="none">HM-01 Lined Dog Coat, waxed cotton — pattern pieces, base size L (55 cm) — Bellowerk Manufaktur, v1.0, 17 Sep 2026</text>
  <text x="40" y="66" fill="#000" stroke="none">Shell waxed cotton 380–420 g/m² · wadding 100 g/m² · lining firm cotton check · all outer edges BOUND (30 mm bias, 8 mm finished, contrast) · solid brass ring snaps only</text>
  <text x="40" y="88" fill="#000" stroke="none" font-size="14">All dimensions in mm. Drawing 1 px = 1 mm. Bound edges are cut ON the finished line (no allowance). Add 10 mm only where pieces are sewn together (collar to body, strap to body).</text>

  <!-- ============ BODY PANEL ============ -->
  <g transform="translate(90,190)">
    <path d="M 0,0 C 0,80 8,160 40,200 C 110,235 170,240 230,240 C 300,240 355,235 400,225 C 430,220 445,195 455,165 C 490,150 515,148 540,150 C 552,120 552,90 548,58 L 548,34 C 548,14 534,0 512,0 Z" fill="#f4f4f4" stroke="#000"/>
    <line x1="0" y1="0" x2="512" y2="0" stroke="#000" stroke-width="3" stroke-dasharray="14 6 3 6"/>
    <text x="150" y="-12" fill="#000" stroke="none" font-size="14">SPINE — CUT 1 ON FOLD (shell, lining, wadding)</text>

    <text x="150" y="64" fill="#000" stroke="none" font-size="22" font-weight="bold">BODY PANEL</text>
    <text x="150" y="88" fill="#000" stroke="none" font-size="13">shell 1× · lining 1× · wadding 1× (wadding −8 all round)</text>
    <text x="150" y="108" fill="#000" stroke="none" font-size="13">grain line ∥ spine</text>
    <line x1="150" y1="118" x2="260" y2="118" stroke="#000" stroke-width="1.5" marker-start="url(#b)" marker-end="url(#a)"/>

    <!-- leash slit -->
    <line x1="120" y1="0" x2="200" y2="0" stroke="#000" stroke-width="6"/>
    <line x1="120" y1="-6" x2="120" y2="6" stroke="#000" stroke-width="2"/>
    <line x1="200" y1="-6" x2="200" y2="6" stroke="#000" stroke-width="2"/>
    <text x="106" y="-36" fill="#000" stroke="none" font-size="13">leash slit 80, bound + BARTACKED both ends</text>
    <text x="440" y="-36" fill="#000" stroke="none" font-size="13">tail notch 76 × 34 (on fold)</text>
    <line x1="0" y1="24" x2="120" y2="24" stroke="#000" stroke-width="1" marker-start="url(#b)" marker-end="url(#a)"/>
    <text x="46" y="40" fill="#000" stroke="none" font-size="12">120</text>

    <!-- belly strap seat -->
    <line x1="300" y1="152" x2="300" y2="238" stroke="#000" stroke-width="1.5" stroke-dasharray="8 5"/>
    <rect x="286" y="200" width="28" height="36" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="238" y="136" fill="#000" stroke="none" font-size="13">belly strap seat, 300 behind neck edge</text>
    <text x="238" y="154" fill="#000" stroke="none" font-size="12">bartack box-X · XL/XXL get a 2nd strap +180</text>

    <!-- edge labels -->
    <text x="-46" y="118" fill="#000" stroke="none" font-size="13" transform="rotate(-90,-46,118)" text-anchor="middle">neck edge 250 (half)</text>
    <text x="150" y="266" fill="#000" stroke="none" font-size="13">lower edge — bound, contrast</text>
    <text x="392" y="200" fill="#000" stroke="none" font-size="12">hind-leg cut-out 70</text>

    <!-- dims -->
    <line x1="0" y1="-58" x2="548" y2="-58" stroke="#000" stroke-width="1" marker-start="url(#b)" marker-end="url(#a)"/>
    <text x="196" y="-64" fill="#000" stroke="none" font-size="14">550 back length (spine)</text>
    <line x1="230" y1="258" x2="230" y2="294" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="0" y1="290" x2="230" y2="290" stroke="#000" stroke-width="1" marker-start="url(#b)" marker-end="url(#a)"/>
    <text x="16" y="308" fill="#000" stroke="none" font-size="13">widest at 230 from neck edge</text>
    <line x1="592" y1="0" x2="592" y2="240" stroke="#000" stroke-width="1" marker-start="url(#b)" marker-end="url(#a)"/>
    <line x1="548" y1="150" x2="592" y2="150" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
    <text x="600" y="124" fill="#000" stroke="none" font-size="13">230 half width</text>
    <text x="600" y="142" fill="#000" stroke="none" font-size="12">at chest / ribs</text>
    <text x="600" y="168" fill="#000" stroke="none" font-size="12">175 at tail end</text>
  </g>

  <!-- ============ COLLAR ============ -->
  <g transform="translate(90,580)">
    <path d="M 0,0 C 130,-14 390,-14 520,0 L 520,150 C 390,136 130,136 0,150 Z" fill="#f4f4f4" stroke="#000"/>
    <line x1="260" y1="-9" x2="260" y2="143" stroke="#000" stroke-width="1.2" stroke-dasharray="8 5"/>
    <text x="266" y="76" fill="#000" stroke="none" font-size="12">CB — cut on fold</text>
    <text x="0" y="-52" fill="#000" stroke="none" font-size="20" font-weight="bold">COLLAR (stand, rolls over)</text>
    <text x="0" y="-32" fill="#000" stroke="none" font-size="13">shell 1× on fold · corduroy or check inner 1× · wadding 1× (−8)</text>
    <text x="180" y="-14" fill="#000" stroke="none" font-size="12">top edge — bound</text>
    <text x="110" y="180" fill="#000" stroke="none" font-size="13">520 finished length · neck edge, sewn to body (+10 SA)</text>
    <text x="536" y="80" fill="#000" stroke="none" font-size="13">height 150</text>
    <circle cx="26" cy="46" r="7" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="26" cy="106" r="7" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="44" y="42" fill="#000" stroke="none" font-size="12">2 throat snaps, pitch 40</text>
    <text x="44" y="60" fill="#000" stroke="none" font-size="12">= 40 mm neck adjustment</text>
    <circle cx="492" cy="76" r="7" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="372" y="112" fill="#000" stroke="none" font-size="12">counter sockets</text>
  </g>

  <!-- ============ CONTRAST YOKE ============ -->
  <g transform="translate(720,620)">
    <path d="M 0,0 L 200,0 C 190,60 180,110 160,140 L 0,140 Z" fill="#e8e8e8" stroke="#000"/>
    <text x="0" y="-30" fill="#000" stroke="none" font-size="20" font-weight="bold">CONTRAST YOKE (opt.)</text>
    <text x="0" y="-12" fill="#000" stroke="none" font-size="13">printed cotton, 2× mirrored · 200 × 140</text>
    <text x="0" y="162" fill="#000" stroke="none" font-size="12">edges turned + topstitched,</text>
    <text x="0" y="180" fill="#000" stroke="none" font-size="12">applied before the layers are joined.</text>
    <text x="0" y="198" fill="#000" stroke="none" font-size="12">Björn decides — spec §8.3</text>
  </g>

  <!-- ============ BELLY STRAP ============ -->
  <g transform="translate(90,880)">
    <path d="M 0,0 L 285,0 A 35 35 0 0 1 285,70 L 0,70 Z" fill="#f4f4f4" stroke="#000"/>
    <circle cx="275" cy="35" r="7" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="235" cy="35" r="7" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="195" cy="35" r="7" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="4" y="6" width="52" height="58" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="6 4"/>
    <line x1="4" y1="6" x2="56" y2="64" stroke="#000" stroke-width="1"/>
    <line x1="56" y1="6" x2="4" y2="64" stroke="#000" stroke-width="1"/>
    <text x="0" y="-30" fill="#000" stroke="none" font-size="20" font-weight="bold">BELLY STRAP</text>
    <text x="0" y="-12" fill="#000" stroke="none" font-size="13">shell 1× + lining 1× per strap · 320 × 70 finished</text>
    <text x="0" y="98" fill="#000" stroke="none" font-size="12">box-X bartack into the body panel</text>
    <text x="0" y="116" fill="#000" stroke="none" font-size="12">3 snaps, pitch 40 = ±40 mm girth adjustment</text>
  </g>

  <!-- ============ COUNTER PATCH ============ -->
  <g transform="translate(500,880)">
    <rect x="0" y="0" width="90" height="90" rx="14" fill="#f4f4f4" stroke="#000"/>
    <circle cx="45" cy="45" r="7" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="0" y="-30" fill="#000" stroke="none" font-size="20" font-weight="bold">COUNTER PATCH</text>
    <text x="0" y="-12" fill="#000" stroke="none" font-size="13">shell + lining · 90 × 90</text>
    <text x="0" y="112" fill="#000" stroke="none" font-size="12">opposite side, 1 socket</text>
  </g>

  <!-- ============ SIZE TABLE ============ -->
  <g transform="translate(980,190)" fill="#000" stroke="none">
    <text x="0" y="0" font-size="18" font-weight="bold">Sizes — primary measurement is the back length</text>
    <line x1="0" y1="10" x2="720" y2="10" stroke="#000" stroke-width="1"/>
    <text x="0" y="30" font-size="13" font-weight="bold">Size</text>
    <text x="70" y="30" font-size="13" font-weight="bold">Back length</text>
    <text x="190" y="30" font-size="13" font-weight="bold">Chest girth</text>
    <text x="305" y="30" font-size="13" font-weight="bold">Neck girth</text>
    <text x="415" y="30" font-size="13" font-weight="bold">Typical breeds</text>
    <line x1="0" y1="38" x2="720" y2="38" stroke="#000" stroke-width="1"/>
    <text x="0" y="58" font-size="13" font-weight="bold">M</text><text x="70" y="58" font-size="13">45 cm</text><text x="190" y="58" font-size="13">58–70 cm</text><text x="305" y="58" font-size="13">36–46 cm</text><text x="415" y="58" font-size="13">Cocker, Beagle, Sheltie</text>
    <text x="0" y="78" font-size="13" font-weight="bold">L</text><text x="70" y="78" font-size="13" font-weight="bold">55 cm</text><text x="190" y="78" font-size="13">68–82 cm</text><text x="305" y="78" font-size="13">42–52 cm</text><text x="415" y="78" font-size="13">Vizsla, Weimaraner, Border Collie</text>
    <text x="0" y="98" font-size="13" font-weight="bold">XL</text><text x="70" y="98" font-size="13">65 cm</text><text x="190" y="98" font-size="13">78–94 cm</text><text x="305" y="98" font-size="13">48–58 cm</text><text x="415" y="98" font-size="13">Labrador, Golden, German Shepherd</text>
    <text x="0" y="118" font-size="13" font-weight="bold">XXL</text><text x="70" y="118" font-size="13">75 cm</text><text x="190" y="118" font-size="13">88–106 cm</text><text x="305" y="118" font-size="13">54–64 cm</text><text x="415" y="118" font-size="13">Rottweiler, Bernese, Dobermann</text>
    <line x1="0" y1="128" x2="720" y2="128" stroke="#000" stroke-width="1"/>
    <text x="0" y="148" font-size="12">Girth ranges overlap on purpose: a dog between two sizes takes the larger one. No sighthounds (brand brief).</text>

    <text x="0" y="192" font-size="18" font-weight="bold">Pattern measurements per size (mm)</text>
    <line x1="0" y1="202" x2="720" y2="202" stroke="#000" stroke-width="1"/>
    <text x="0" y="222" font-size="13" font-weight="bold">Measurement</text>
    <text x="400" y="222" font-size="13" font-weight="bold">M</text>
    <text x="490" y="222" font-size="13" font-weight="bold">L</text>
    <text x="580" y="222" font-size="13" font-weight="bold">XL</text>
    <text x="660" y="222" font-size="13" font-weight="bold">XXL</text>
    <line x1="0" y1="230" x2="720" y2="230" stroke="#000" stroke-width="1"/>
    <text x="0" y="250" font-size="13">Body panel, spine length (fold)</text><text x="400" y="250" font-size="13">450</text><text x="490" y="250" font-size="13" font-weight="bold">550</text><text x="580" y="250" font-size="13">650</text><text x="660" y="250" font-size="13">750</text>
    <text x="0" y="270" font-size="13">Half width at chest / ribs</text><text x="400" y="270" font-size="13">195</text><text x="490" y="270" font-size="13" font-weight="bold">230</text><text x="580" y="270" font-size="13">265</text><text x="660" y="270" font-size="13">300</text>
    <text x="0" y="290" font-size="13">Half width at tail end</text><text x="400" y="290" font-size="13">150</text><text x="490" y="290" font-size="13" font-weight="bold">175</text><text x="580" y="290" font-size="13">200</text><text x="660" y="290" font-size="13">225</text>
    <text x="0" y="310" font-size="13">Neck opening circumference</text><text x="400" y="310" font-size="13">420</text><text x="490" y="310" font-size="13" font-weight="bold">500</text><text x="580" y="310" font-size="13">580</text><text x="660" y="310" font-size="13">660</text>
    <text x="0" y="330" font-size="13">Collar height (stand)</text><text x="400" y="330" font-size="13">130</text><text x="490" y="330" font-size="13" font-weight="bold">150</text><text x="580" y="330" font-size="13">170</text><text x="660" y="330" font-size="13">190</text>
    <text x="0" y="350" font-size="13">Collar length, finished</text><text x="400" y="350" font-size="13">440</text><text x="490" y="350" font-size="13" font-weight="bold">520</text><text x="580" y="350" font-size="13">600</text><text x="660" y="350" font-size="13">680</text>
    <text x="0" y="370" font-size="13">Belly strap, length × width</text><text x="400" y="370" font-size="13">280×60</text><text x="490" y="370" font-size="13" font-weight="bold">320×70</text><text x="580" y="370" font-size="13">380×80</text><text x="660" y="370" font-size="13">440×90</text>
    <text x="0" y="390" font-size="13">Number of belly straps</text><text x="400" y="390" font-size="13">1</text><text x="490" y="390" font-size="13" font-weight="bold">1</text><text x="580" y="390" font-size="13">2</text><text x="660" y="390" font-size="13">2</text>
    <text x="0" y="410" font-size="13">Hind-leg cut-out, depth</text><text x="400" y="410" font-size="13">60</text><text x="490" y="410" font-size="13" font-weight="bold">70</text><text x="580" y="410" font-size="13">85</text><text x="660" y="410" font-size="13">100</text>
    <text x="0" y="430" font-size="13">Leash slit, length</text><text x="400" y="430" font-size="13">70</text><text x="490" y="430" font-size="13" font-weight="bold">80</text><text x="580" y="430" font-size="13">90</text><text x="660" y="430" font-size="13">100</text>
    <text x="0" y="450" font-size="13">Binding needed, total</text><text x="400" y="450" font-size="13">3600</text><text x="490" y="450" font-size="13" font-weight="bold">4000</text><text x="580" y="450" font-size="13">4600</text><text x="660" y="450" font-size="13">5200</text>
    <line x1="0" y1="460" x2="720" y2="460" stroke="#000" stroke-width="1"/>
    <text x="0" y="480" font-size="12">Grading in 100 mm steps of back length. Tolerance: length ±10, width ±5. Drawing shows size L.</text>

    <text x="0" y="524" font-size="18" font-weight="bold">Hardware per coat</text>
    <line x1="0" y1="534" x2="720" y2="534" stroke="#000" stroke-width="1"/>
    <text x="0" y="554" font-size="13">Solid brass ring snaps Ø15, unlacquered, pull-off ≥ 40 N:</text>
    <text x="0" y="574" font-size="13">2 throat + 1 chest + 3 strap + 1 counter = 7 (M/L), 11 (XL/XXL).</text>
    <text x="0" y="596" font-size="13">NO hook-and-loop (collects fur and burrs) · NO plastic buckles ·</text>
    <text x="0" y="616" font-size="13">NO zinc alloy · NO nickel · NO plated steel.</text>
    <text x="0" y="638" font-size="13">1 leather patch PATCH-01, sewn to the left side panel.</text>
    <text x="0" y="658" font-size="13">Size label in the collar (model, size, back length in cm).</text>
  </g>

  <!-- ============ NOTES ============ -->
  <g transform="translate(90,1060)" fill="#000" stroke="none">
    <text x="0" y="0" font-size="18" font-weight="bold">Construction notes</text>
    <line x1="0" y1="10" x2="1720" y2="10" stroke="#000" stroke-width="1"/>
    <text x="0" y="32" font-size="14">1 · Layer build shell — wadding — lining. Baste the wadding to the lining with 3 long rows (they disappear under the binding), then treat as one piece. NO quilting: the reference coat is flat.</text>
    <text x="0" y="56" font-size="14">2 · Every outer edge is BOUND with 30 mm bias binding, 8 mm finished, topstitched close to the edge. The binding is also the design line — even width, contrast colour, no joins on a corner.</text>
    <text x="0" y="80" font-size="14">3 · Leash slit and belly strap are the two load points: slit bound all round and bartacked at both ends (pull test 150 N / 30 s), strap bartacked into the body panel in a box-X.</text>
    <text x="0" y="104" font-size="14">4 · Collar sewn to the neck edge with 10 mm seam, seam covered by the binding. It must STAND when open and roll over when closed. 2 throat snaps + 1 chest snap at the front corners.</text>
    <text x="0" y="128" font-size="14">5 · Waxed cotton: NO PINS (holes stay) — clips only. Needle 100/16–110/18, stitch length 3.5 mm, PTFE or roller foot. No hot iron — the wax melts.</text>
    <text x="0" y="152" font-size="14">6 · Must survive 30 °C machine wash without the wadding migrating. Lining yarn-dyed (not printed), pre-shrunk, max 3 % shrinkage after 3 washes, colour fastness ≥ 4.</text>
  </g>
</svg>
