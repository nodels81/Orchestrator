<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="none" stroke="#000" stroke-width="2">
  <rect x="0" y="0" width="1400" height="700" fill="#fff" stroke="none"/>
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#000" stroke="none">LE-01 Adjustable Leather Lead 3.00 m — 20 mm — scale 1:2.5 (length) — Bellowerk Manufaktur, v1.1, 9 Sep 2026</text>
  <text x="40" y="66" fill="#000" stroke="none">One continuous strap, veg-tan oiled cowhide 3.5–4.0 mm · 2 solid brass swivel bolt snaps · 3 welded solid brass O-rings · hooks and rings held by 3-strand mystery braid + 1 Chicago screw · NO stitching, NO rivets</text>

  <!-- scale: 1 cm = 4 px horizontally. 300 cm = 1200 px. origin x=120 -->
  <g id="strap">
    <rect x="120" y="200" width="1200" height="20" stroke-width="2.5"/>
    <!-- hook A -->
    <g transform="translate(120,210)">
      <path d="M 0 0 H -20 A 12 12 0 1 0 -44 0 A 12 12 0 1 0 -20 0" stroke-width="3"/>
      <path d="M -44 0 H -70 A 10 10 0 0 1 -70 -18 L -60 -18" stroke-width="3"/>
      <path d="M -70 0 A 10 10 0 0 0 -70 18 L -50 18" stroke-width="3"/>
    </g>
    <text x="20" y="250" fill="#000" stroke="none" font-size="14">hook A</text>
    <!-- hook B -->
    <g transform="translate(1320,210)">
      <path d="M 0 0 H 20 A 12 12 0 1 1 44 0 A 12 12 0 1 1 20 0" stroke-width="3"/>
      <path d="M 44 0 H 70 A 10 10 0 0 0 70 -18 L 60 -18" stroke-width="3"/>
      <path d="M 70 0 A 10 10 0 0 1 70 18 L 50 18" stroke-width="3"/>
    </g>
    <text x="1330" y="250" fill="#000" stroke="none" font-size="14">hook B</text>
    <!-- folds 5 cm = 20 px at hook A (120..140), rings and hook B -->
    <g stroke-dasharray="5 3">
      <line x1="140" y1="200" x2="140" y2="220"/>
      <line x1="1300" y1="200" x2="1300" y2="220"/>
    </g>
    <!-- rings at 45,140,245 cm => x = 120+180=300, 120+560=680, 120+980=1100 -->
    <g stroke-width="3">
      <circle cx="300" cy="210" r="14"/>
      <circle cx="680" cy="210" r="14"/>
      <circle cx="1100" cy="210" r="14"/>
    </g>
    <!-- braided sections (12 cm = 48 px) at each attachment, 1 screw each -->
    <g stroke-width="1.2">
      <path d="M 120 202 l 8 16 l 8 -16 l 8 16 l 8 -16 l 8 16 l 8 -16" /><circle cx="176" cy="210" r="3.5"/>
      <path d="M 314 202 l 8 16 l 8 -16 l 8 16 l 8 -16 l 8 16 l 8 -16" /><circle cx="370" cy="210" r="3.5"/>
      <path d="M 694 202 l 8 16 l 8 -16 l 8 16 l 8 -16 l 8 16 l 8 -16" /><circle cx="750" cy="210" r="3.5"/>
      <path d="M 1114 202 l 8 16 l 8 -16 l 8 16 l 8 -16 l 8 16 l 8 -16" /><circle cx="1170" cy="210" r="3.5"/>
      <path d="M 1264 202 l 8 16 l 8 -16 l 8 16 l 8 -16 l 8 16 l 8 -16" /><circle cx="1258" cy="210" r="3.5"/>
    </g>
    <text x="270" y="180" fill="#000" stroke="none" font-size="14">ring 1</text>
    <text x="650" y="180" fill="#000" stroke="none" font-size="14">ring 2</text>
    <text x="1070" y="180" fill="#000" stroke="none" font-size="14">ring 3</text>
    <!-- nameplate at 8 cm => x=120+32=152, 40x14 mm at this scale ~ 16x6px; draw symbolic 40x14 px -->
    <rect x="192" y="204" width="26" height="12" rx="3" stroke-width="1.5"/>
    <text x="150" y="250" fill="#000" stroke="none" font-size="13">leather patch PATCH-01 PA-S (65×14 mm) at 8 cm after braid</text>
  </g>

  <!-- dimension chain from hook A -->
  <g stroke-width="1.5">
    <line x1="120" y1="300" x2="300" y2="300"/>
    <line x1="120" y1="290" x2="120" y2="310"/>
    <line x1="300" y1="290" x2="300" y2="310"/>
    <text x="210" y="322" text-anchor="middle" fill="#000" stroke="none">45 cm</text>

    <line x1="120" y1="350" x2="680" y2="350"/>
    <line x1="680" y1="340" x2="680" y2="360"/>
    <line x1="120" y1="340" x2="120" y2="360"/>
    <text x="400" y="372" text-anchor="middle" fill="#000" stroke="none">140 cm</text>

    <line x1="120" y1="400" x2="1100" y2="400"/>
    <line x1="1100" y1="390" x2="1100" y2="410"/>
    <line x1="120" y1="390" x2="120" y2="410"/>
    <text x="610" y="422" text-anchor="middle" fill="#000" stroke="none">245 cm</text>

    <line x1="120" y1="450" x2="1320" y2="450"/>
    <line x1="1320" y1="440" x2="1320" y2="460"/>
    <line x1="120" y1="440" x2="120" y2="460"/>
    <text x="720" y="472" text-anchor="middle" fill="#000" stroke="none">300 cm (hook eye to hook eye) · all positions ±1 cm, measured from inner edge of hook A eye</text>

    <!-- width -->
    <line x1="900" y1="150" x2="900" y2="200"/>
    <line x1="900" y1="150" x2="900" y2="200" stroke-dasharray="3 3"/>
    <line x1="880" y1="200" x2="880" y2="220"/>
    <line x1="872" y1="200" x2="888" y2="200"/>
    <line x1="872" y1="220" x2="888" y2="220"/>
    <text x="850" y="145" fill="#000" stroke="none" font-size="13">strap width 20 mm ±0.5</text>
  </g>

  <!-- detail: braided attachment -->
  <g transform="translate(60,510)">
    <text x="0" y="0" fill="#000" stroke="none" font-weight="bold">Detail: braided attachment at hook / ring (scale ~1:1.5)</text>
    <circle cx="-2" cy="40" r="22" stroke-width="3"/>
    <rect x="20" y="30" width="300" height="20" fill="#ddd" stroke="#000"/>
    <!-- braid chevrons over 80 mm ~ 120 px -->
    <path d="M 40 32 l 10 16 l 10 -16 l 10 16 l 10 -16 l 10 16 l 10 -16 l 10 16 l 10 -16 l 10 16 l 10 -16 l 10 16 l 10 -16" stroke-width="1.5"/>
    <path d="M 40 48 l 10 -16 l 10 16 l 10 -16 l 10 16 l 10 -16 l 10 16 l 10 -16 l 10 16 l 10 -16 l 10 16 l 10 -16 l 10 16" stroke-width="1.5"/>
    <circle cx="200" cy="40" r="6" fill="#c9a44a" stroke="#000"/>
    <line x1="40" y1="60" x2="160" y2="60" stroke-width="1.2"/><line x1="40" y1="55" x2="40" y2="65" stroke-width="1.2"/><line x1="160" y1="55" x2="160" y2="65" stroke-width="1.2"/>
    <text x="100" y="78" text-anchor="middle" fill="#000" stroke="none" font-size="12">braid 80 mm</text>
    <line x1="20" y1="90" x2="230" y2="90" stroke-width="1.2"/><line x1="20" y1="85" x2="20" y2="95" stroke-width="1.2"/><line x1="230" y1="85" x2="230" y2="95" stroke-width="1.2"/>
    <text x="125" y="108" text-anchor="middle" fill="#000" stroke="none" font-size="12">fold-back 120 mm</text>
    <text x="0" y="135" fill="#000" stroke="none" font-size="13">Strap through ring/hook eye, folded back 120 mm. Two lengthwise slits → 3 strands, "mystery braid" (one piece, ends uncut),</text>
    <text x="0" y="153" fill="#000" stroke="none" font-size="13">6–8 crossings, chevron pattern as photo. Free end flat on the inside, 1 Chicago screw 15 mm after the braid. Attachment ≥ 2.0 kN.</text>
    <text x="0" y="171" fill="#000" stroke="none" font-size="13">O-ring welded solid brass, inner Ø 25 mm, wire Ø 5 mm, ≥ 3 kN · ring does NOT slide · alternative plain fold 50 mm + 2 screws only on request</text>
  </g>

  <g transform="translate(900,510)">
    <text x="0" y="0" fill="#000" stroke="none" font-weight="bold">Six working lengths</text>
    <text x="0" y="24" fill="#000" stroke="none" font-size="13">B→ring 3: 245 · B→ring 2: 140 (loop 160, hands-free) · B→ring 1: 45 cm</text>
    <text x="0" y="44" fill="#000" stroke="none" font-size="13">A→ring 1: 255 · A→ring 2: 160 · A→ring 3: 55 cm · both hooks: 300 cm</text>
    <text x="0" y="74" fill="#000" stroke="none" font-size="13">Cut length of strap: 360 cm (300 + 5 attachments × 12 cm).</text>
    <text x="0" y="94" fill="#000" stroke="none" font-size="13">Swivel bolt snap solid brass, polished, eye 20 mm, ≥ 2 kN.</text>
    <text x="0" y="114" fill="#000" stroke="none" font-size="13">Colours: grey, dark brown, olive, cognac. One hide per lead.</text>
    <text x="0" y="134" fill="#000" stroke="none" font-size="13">Screw heads on grain side. Edges bevelled + burnished, no paint.</text>
  </g>
</svg>
