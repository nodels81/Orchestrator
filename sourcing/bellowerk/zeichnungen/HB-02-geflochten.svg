<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="none" stroke="#000" stroke-width="2">
  <rect x="0" y="0" width="1400" height="560" fill="#fff" stroke="none"/>
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#000" stroke="none">HB-02 Braided Leather Collar — size M (30 mm) — scale 1:2 — Bellowerk v1.1, 13 Sep 2026</text>
  <text x="40" y="66" fill="#000" stroke="none">One-piece strap: flat buckle end · 3-strand mystery braid (two slits, ends uncut, chevron pattern) with solid brass O-ring · flat hole end · NO stitching, NO rivets</text>

  <!-- scale 1 mm = 2 px. Strap 30 mm = 60 px (y 200..260). buckle end 160 mm = 320 px; braid 220 mm = 440 px; hole end 120 mm = 240 px. origin x=100 -->
  <g>
    <rect x="100" y="200" width="320" height="60" stroke-width="2.5"/>
    <rect x="88" y="190" width="14" height="80" rx="3" stroke-width="3"/>
    <line x1="95" y1="190" x2="95" y2="270" stroke-width="3"/>
    <rect x="172" y="194" width="14" height="72"/>
    <circle cx="207" cy="216" r="5"/><circle cx="207" cy="244" r="5"/>
    <line x1="220" y1="200" x2="220" y2="260" stroke-dasharray="6 4"/>
    <text x="110" y="190" fill="#000" stroke="none" font-size="13">buckle fold 60 mm, keeper, 2 screws, roller buckle 30 mm</text>
    <!-- patch PA-M 85x20 -> 170x40 -->
    <rect x="240" y="210" width="170" height="40" rx="6" fill="#e8c9a0" stroke="#000"/>
    <circle cx="254" cy="230" r="6" fill="#c9a44a"/><circle cx="396" cy="230" r="6" fill="#c9a44a"/>
    <text x="325" y="228" text-anchor="middle" fill="#2a1a0e" stroke="none" font-size="11" letter-spacing="2" font-weight="bold">BELLOWERK</text>
    <text x="360" y="243" text-anchor="middle" fill="#2a1a0e" stroke="none" font-size="8" font-style="italic">Manufaktur</text>
    <text x="250" y="286" fill="#000" stroke="none" font-size="13">patch PATCH-01 PA-M (85×20 mm), 2 screws</text>

    <!-- braid section 220 mm = 440 px, x 420..860 -->
    <rect x="420" y="200" width="440" height="60" stroke-dasharray="2 3" stroke-width="1"/>
    <g stroke-width="1.6">
      <path d="M 420 203 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27"/>
      <path d="M 420 257 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27"/>
      <path d="M 660 203 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27"/>
      <path d="M 660 257 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27 l 12 -27 l 12 27"/>
    </g>
    <!-- O-ring at centre of braid x=640, inner width = strap width 30 mm = 60 px -->
    <circle cx="640" cy="230" r="33" stroke-width="4"/>
    <text x="470" y="180" fill="#000" stroke="none" font-size="14">3-strand mystery braid, 220 mm finished (cut +15 %)</text>
    <text x="560" y="300" fill="#000" stroke="none" font-size="13">O-ring solid brass, inner width = strap width (30 mm), wire Ø 5 mm, worked into the braid at centre back</text>

    <!-- hole end 120 mm = 240 px, x 860..1100 -->
    <path d="M 860 200 H 1070 A 30 30 0 0 1 1070 260 H 860 Z" stroke-width="2.5"/>
    <g stroke-width="2">
      <ellipse cx="1045" cy="230" rx="8" ry="5"/><ellipse cx="995" cy="230" rx="8" ry="5"/><ellipse cx="945" cy="230" rx="8" ry="5"/><ellipse cx="895" cy="230" rx="8" ry="5"/>
    </g>
    <text x="880" y="190" fill="#000" stroke="none" font-size="13">holes 5×8 mm, pitch 25 mm</text>
  </g>

  <!-- dims -->
  <g stroke-width="1.5">
    <line x1="100" y1="340" x2="420" y2="340"/><line x1="100" y1="332" x2="100" y2="348"/><line x1="420" y1="332" x2="420" y2="348"/>
    <text x="260" y="362" text-anchor="middle" fill="#000" stroke="none">flat buckle end 160 mm</text>
    <line x1="420" y1="340" x2="860" y2="340"/><line x1="860" y1="332" x2="860" y2="348"/>
    <text x="640" y="362" text-anchor="middle" fill="#000" stroke="none">braided section 220 mm (size M)</text>
    <line x1="860" y1="340" x2="1100" y2="340"/><line x1="1100" y1="332" x2="1100" y2="348"/>
    <text x="980" y="362" text-anchor="middle" fill="#000" stroke="none">flat hole end 120 mm</text>
    <line x1="1140" y1="200" x2="1140" y2="260"/><line x1="1132" y1="200" x2="1148" y2="200"/><line x1="1132" y1="260" x2="1148" y2="260"/>
    <text x="1152" y="235" fill="#000" stroke="none">30 mm</text>
  </g>

  <g transform="translate(100,420)">
    <text x="0" y="0" fill="#000" stroke="none" font-weight="bold">Sizes (starting values — confirm)</text>
    <text x="0" y="24" fill="#000" stroke="none" font-size="14">S: 25 mm, braid 180, ends 140/120, neck 30–40 cm · M: 30 mm, braid 220, ends 160/120, neck 38–48 cm</text>
    <text x="0" y="44" fill="#000" stroke="none" font-size="14">L: 35 mm, braid 260, ends 160/140, neck 46–56 cm · XL: 40 mm, braid 300, ends 180/140, neck 54–64 cm</text>
    <text x="0" y="74" fill="#000" stroke="none" font-size="14">Mystery braid: two lengthwise slits, three equal strands, slit ends punched Ø 2 mm, ends stay uncut. Tight, even, chevron pattern as photo.</text>
    <text x="0" y="94" fill="#000" stroke="none" font-size="14">Option two-tone (dark brown + grey) — factory to propose method without stitching. Colours: grey, dark brown, olive, cognac, black.</text>
    <text x="0" y="114" fill="#000" stroke="none" font-size="14">Buckle and O-ring inner width = strap width. Patch PA-M 85×20 mm on every size. Strand width ≈ strap width ÷ 3 (S ≈ 8 mm … XL ≈ 13 mm).</text>
  </g>
</svg>
