<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="none" stroke="#000" stroke-width="2">
  <rect x="0" y="0" width="1400" height="620" fill="#fff" stroke="none"/>
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#000" stroke="none">HB-01 Leather Dog Collar — size M (30 mm) — scale 1:2 — Bellowerk v1.1, 13 Sep 2026</text>
  <text x="40" y="66" fill="#000" stroke="none">Single layer vegetable-tanned oiled cowhide 3.5–4.0 mm · solid brass hardware · NO stitching · NO rivets · Chicago screws only</text>

  <!-- scale: 1 mm = 2 px. Strap 600 mm x 30 mm -> 1200 x 60 px, origin x=100, y=200 -->
  <g id="strap">
    <!-- buckle end (left) folded: show fold as double line 60 mm = 120 px -->
    <path d="M 100 200 H 1250 A 30 30 0 0 1 1250 260 H 100 Z" stroke-width="2.5"/>
    <!-- fold region hatch -->
    <line x1="220" y1="200" x2="220" y2="260" stroke-dasharray="6 4"/>
    <text x="126" y="190" fill="#000" stroke="none" font-size="14">fold 60 mm</text>
    <!-- buckle -->
    <rect x="88" y="190" width="14" height="80" rx="3" stroke-width="3"/>
    <line x1="95" y1="190" x2="95" y2="270" stroke-width="3"/>
    <path d="M 95 230 L 150 230" stroke-width="3"/>
    <text x="60" y="300" fill="#000" stroke="none" font-size="14">roller buckle 30 mm, solid brass</text>
    <!-- D-ring in fold at 20 mm behind buckle = x 100+40 -->
    <path d="M 140 196 V 264" stroke-width="3"/>
    <path d="M 140 196 C 180 196 180 264 140 264" stroke-width="3"/>
    <text x="152" y="286" fill="#000" stroke="none" font-size="14">D-ring welded, solid brass, inner width 30 mm</text>
    <!-- keeper at 15 mm behind D ring -> x 140+30=170..185 -->
    <rect x="172" y="194" width="14" height="72" stroke-width="2"/>
    <text x="150" y="176" fill="#000" stroke="none" font-size="14">keeper</text>
    <!-- 2 chicago screws in the fold, side by side for 30/35/40 mm -->
    <circle cx="207" cy="216" r="5" stroke-width="2"/>
    <circle cx="207" cy="244" r="5" stroke-width="2"/>
    <!-- patch PA-M 85x20 mm => 170x40 px, 30 mm behind fold (fold ends x 220) -->
    <rect x="280" y="210" width="170" height="40" rx="4" stroke-width="2"/>
    <circle cx="294" cy="230" r="4"/>
    <circle cx="436" cy="230" r="4"/>
    <text x="365" y="228" text-anchor="middle" fill="#000" stroke="none" font-size="11" letter-spacing="2" font-weight="bold">BELLOWERK</text>
    <text x="395" y="241" text-anchor="middle" fill="#000" stroke="none" font-size="8" font-style="italic">Manufaktur</text>
    <text x="280" y="176" fill="#000" stroke="none" font-size="14">leather patch PATCH-01 PA-M (85×20 mm), 2 Chicago screws, 30 mm behind fold</text>
    <!-- holes: from tip (x=1250) at 60,85,110,135,160 mm => 120,170,220,270,320 px -->
    <g stroke-width="2">
      <ellipse cx="1130" cy="230" rx="8" ry="5"/>
      <ellipse cx="1080" cy="230" rx="8" ry="5"/>
      <ellipse cx="1030" cy="230" rx="8" ry="5"/>
      <ellipse cx="980" cy="230" rx="8" ry="5"/>
      <ellipse cx="930" cy="230" rx="8" ry="5"/>
    </g>
    <text x="880" y="176" fill="#000" stroke="none" font-size="14">5 oval holes 5×8 mm, pitch 25 mm, first hole 60 mm from tip</text>
  </g>

  <!-- dimensions -->
  <g stroke-width="1.5">
    <!-- overall length -->
    <line x1="100" y1="340" x2="1250" y2="340"/>
    <line x1="100" y1="330" x2="100" y2="350"/>
    <line x1="1250" y1="330" x2="1250" y2="350"/>
    <text x="675" y="362" text-anchor="middle" fill="#000" stroke="none">cut length 600 mm (size M) — S 520 · L 680 · XL 760</text>
    <!-- width -->
    <line x1="1300" y1="200" x2="1300" y2="260"/>
    <line x1="1290" y1="200" x2="1310" y2="200"/>
    <line x1="1290" y1="260" x2="1310" y2="260"/>
    <text x="1315" y="235" fill="#000" stroke="none">30 mm</text>
    <!-- hole pitch -->
    <line x1="1080" y1="310" x2="1130" y2="310"/>
    <line x1="1080" y1="302" x2="1080" y2="318"/>
    <line x1="1130" y1="302" x2="1130" y2="318"/>
    <text x="1105" y="328" text-anchor="middle" fill="#000" stroke="none" font-size="13">25</text>
    <line x1="1130" y1="290" x2="1250" y2="290"/>
    <line x1="1130" y1="282" x2="1130" y2="298"/>
    <line x1="1250" y1="282" x2="1250" y2="298"/>
    <text x="1190" y="280" text-anchor="middle" fill="#000" stroke="none" font-size="13">60</text>
  </g>

  <!-- section view -->
  <g transform="translate(100,410)">
    <text x="0" y="0" fill="#000" stroke="none" font-weight="bold">Section A–A (buckle fold), scale 2:1</text>
    <rect x="0" y="20" width="300" height="16" fill="#ddd"/>
    <rect x="0" y="36" width="300" height="16" fill="#ddd"/>
    <text x="310" y="34" fill="#000" stroke="none" font-size="13">grain side out</text>
    <text x="310" y="50" fill="#000" stroke="none" font-size="13">flesh to flesh, 2 layers × 4 mm</text>
    <!-- chicago screw -->
    <rect x="120" y="12" width="20" height="8" fill="#000"/>
    <rect x="126" y="20" width="8" height="32" fill="#000"/>
    <rect x="120" y="52" width="20" height="8" fill="#000"/>
    <text x="60" y="80" fill="#000" stroke="none" font-size="13">Chicago screw solid brass, domed head Ø 8–9 mm, post 8 mm, thread-locked</text>
  </g>

  <g transform="translate(700,410)">
    <text x="0" y="0" fill="#000" stroke="none" font-weight="bold">Sizes (starting values — confirm)</text>
    <text x="0" y="24" fill="#000" stroke="none" font-size="14">S: 25 mm, neck 30–40 cm, cut 520 mm</text>
    <text x="0" y="44" fill="#000" stroke="none" font-size="14">M: 30 mm, neck 38–48 cm, cut 600 mm</text>
    <text x="0" y="64" fill="#000" stroke="none" font-size="14">L: 35 mm, neck 46–56 cm, cut 680 mm</text>
    <text x="0" y="84" fill="#000" stroke="none" font-size="14">XL: 40 mm, neck 54–64 cm, cut 760 mm</text>
    <text x="0" y="110" fill="#000" stroke="none" font-size="14">Buckle and D-ring inner width = strap width. Patch PA-M on every size.</text>
    <text x="0" y="130" fill="#000" stroke="none" font-size="14">Tolerances: length ±5 mm · width ±0.5 mm · hole pitch ±1 mm</text>
    <text x="0" y="150" fill="#000" stroke="none" font-size="14">Edges bevelled + burnished, no edge paint. Tip: English point.</text>
  </g>
</svg>
