<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style id="bw-css">
:root{
  --papier:#E6E3DA; --blatt:#F4F2EB; --vertiefung:#DCD8CD;
  --tinte:#211C15; --tinte-weich:#5E5648; --tinte-leise:#877E6D;
  --linie:#CBC4B4; --linie-fein:#DED8C9;
  --messing:#8F6B1F; --messing-hell:#C29A46;
  --oliv:#4C5A31; --rost:#8E3A24; --schiefer:#6B6355;
  --fokus:#8F6B1F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papier:#14110D; --blatt:#1D1914; --vertiefung:#262118;
    --tinte:#EDE7D9; --tinte-weich:#AAA08B; --tinte-leise:#857C6A;
    --linie:#3A3227; --linie-fein:#2C261E;
    --messing:#D3A957; --messing-hell:#E0BE77;
    --oliv:#93A468; --rost:#D4775A; --schiefer:#9A9183;
    --fokus:#D3A957;
  }
}
:root[data-theme="dark"]{
  --papier:#14110D; --blatt:#1D1914; --vertiefung:#262118;
  --tinte:#EDE7D9; --tinte-weich:#AAA08B; --tinte-leise:#857C6A;
  --linie:#3A3227; --linie-fein:#2C261E;
  --messing:#D3A957; --messing-hell:#E0BE77;
  --oliv:#93A468; --rost:#D4775A; --schiefer:#9A9183;
  --fokus:#D3A957;
}
*{box-sizing:border-box}
body{
  background:var(--papier); color:var(--tinte);
  font-family:"Newsreader",Georgia,"Times New Roman",serif;
  font-size:17px; line-height:1.55; margin:0;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1080px; margin:0 auto; padding-inline:20px; padding-block:0 64px}
h1,h2,h3,.mark,.eyebrow,button,.pill,th{font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif}
.mono,dd,.masz,.code{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
p{margin:0 0 0.7em}
a{color:var(--messing)}
:focus-visible{outline:2px solid var(--fokus); outline-offset:2px; border-radius:2px}
img{max-width:100%}

/* ---------- Kopf ---------- */
.kopf{padding-block:44px 20px; border-bottom:2px solid var(--tinte)}
.eyebrow{
  font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:var(--tinte-leise); margin:0 0 14px
}
.kopf h1{
  font-size:clamp(30px,6vw,50px); font-weight:700; letter-spacing:-.022em;
  line-height:1.02; margin:0 0 10px; text-wrap:balance
}
.kopf .unter{max-width:62ch; color:var(--tinte-weich); font-size:17px; margin:0}
.kopf .meta{
  display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:18px;
  font-size:12.5px; color:var(--tinte-leise)
}
.kopf .meta span{white-space:nowrap}

/* ---------- Laufzettel ---------- */
.laufzettel{
  position:sticky; top:0; z-index:30; background:var(--papier);
  border-bottom:1px solid var(--linie); margin-bottom:36px;
  padding-block:10px
}
.lz-zeile{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.lz-stand{font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--tinte-weich); white-space:nowrap}
.lz-stand b{color:var(--tinte); font-size:14px}
.lz-links{display:flex; gap:6px; flex-wrap:wrap; margin-left:auto}
.lz-links a{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; text-decoration:none;
  color:var(--tinte-weich); border:1px solid var(--linie); border-radius:2px;
  padding:3px 7px; display:inline-flex; gap:5px; align-items:center; background:var(--blatt)
}
.lz-links a:hover{border-color:var(--messing); color:var(--tinte)}
.punkt{width:7px; height:7px; border-radius:50%; background:var(--tinte-leise); flex:none}
.punkt.gut{background:var(--oliv)} .punkt.rot{background:var(--rost)} .punkt.grau{background:var(--schiefer)}
#sicherung{font-size:11.5px; color:var(--tinte-leise); font-family:"IBM Plex Mono",monospace; white-space:nowrap}

/* ---------- Blatt ---------- */
.blatt{
  background:var(--blatt); border:1px solid var(--linie); border-radius:3px;
  margin-bottom:30px; scroll-margin-top:64px; overflow:hidden
}
.bl-kopf{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  padding:18px 22px 16px; border-bottom:1px solid var(--linie)
}
.code{
  font-size:13px; font-weight:500; color:var(--blatt); background:var(--tinte);
  padding:3px 8px; border-radius:2px; letter-spacing:.04em
}
.bl-kopf h2{font-size:23px; font-weight:600; letter-spacing:-.015em; margin:0; flex:1 1 auto}
.stand{font-size:12px; color:var(--tinte-leise); font-family:"IBM Plex Mono",monospace}
.pill{
  font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  padding:4px 10px; border-radius:2px; border:1px solid currentColor; white-space:nowrap
}
.pill.offen{color:var(--tinte-leise)}
.pill.gut{color:var(--oliv)} .pill.rot{color:var(--rost)} .pill.grau{color:var(--schiefer)}

.zeichnung{background:var(--vertiefung); padding:16px 22px; border-bottom:1px solid var(--linie)}
.zeichnung button{
  display:block; width:100%; padding:4px; cursor:zoom-in; background:#fff;
  border:1px solid var(--linie); border-radius:2px
}
.zeichnung button:hover{border-color:var(--messing)}
.zeichnung img{display:block; width:100%}
.zeichnung figcaption{font-size:12px; color:var(--tinte-weich); margin-top:8px; font-family:"IBM Plex Mono",monospace}

.rumpf{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:0}
@media (max-width:760px){.rumpf{grid-template-columns:1fr}}
.spalte{padding:20px 22px}
.spalte + .spalte{border-left:1px solid var(--linie-fein)}
@media (max-width:760px){.spalte + .spalte{border-left:0; border-top:1px solid var(--linie-fein)}}
h3{
  font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:var(--tinte-leise); margin:0 0 12px
}
.fotos{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; margin:0}
.fotos figure{margin:0}
.fotos button{
  padding:0; border:1px solid var(--linie); background:none; cursor:zoom-in; display:block;
  width:100%; border-radius:2px; overflow:hidden
}
.fotos img{display:block; width:100%; aspect-ratio:3/4; object-fit:cover; object-position:center}
.fotos figcaption{font-size:11px; line-height:1.35; color:var(--tinte-weich); margin-top:5px}
.fehlt{
  font-size:13px; color:var(--tinte-weich); border:1px dashed var(--linie);
  border-radius:2px; padding:12px; margin:0
}
dl.fakten{margin:0; display:grid; grid-template-columns:auto minmax(0,1fr); gap:0}
dl.fakten dt{
  font-family:"Archivo",sans-serif; font-size:11.5px; font-weight:500; letter-spacing:.04em;
  text-transform:uppercase; color:var(--tinte-leise);
  padding:7px 14px 7px 0; border-top:1px solid var(--linie-fein); white-space:nowrap
}
dl.fakten dd{
  margin:0; font-size:13.5px; line-height:1.45; padding:7px 0;
  border-top:1px solid var(--linie-fein)
}
dl.fakten dt:first-of-type,dl.fakten dd:first-of-type{border-top:0}
ol.bau{margin:0; padding-left:1.15em; font-size:14.5px; color:var(--tinte-weich)}
ol.bau li{margin-bottom:5px}
ol.bau li::marker{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--messing)}
.warnung{
  font-size:14px; line-height:1.45; border-left:3px solid var(--rost);
  padding:2px 0 2px 12px; color:var(--tinte-weich); margin:14px 0 0
}

/* ---------- Freigabe ---------- */
.freigabe{border-top:2px solid var(--tinte); padding:18px 22px 22px; background:var(--vertiefung)}
.fr-kopf{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.fr-kopf h3{margin:0}
.wahlen{display:flex; gap:8px; flex-wrap:wrap}
button.wahl,button.chip{
  font-size:12.5px; font-weight:500; letter-spacing:.01em; cursor:pointer;
  background:var(--blatt); color:var(--tinte-weich);
  border:1px solid var(--linie); border-radius:2px; padding:6px 12px;
  transition:border-color .12s ease, color .12s ease
}
button.wahl:hover,button.chip:hover{border-color:var(--tinte-weich); color:var(--tinte)}
button.wahl[aria-pressed="true"]{background:var(--tinte); border-color:var(--tinte); color:var(--blatt)}
button.wahl.gut[aria-pressed="true"]{background:var(--oliv); border-color:var(--oliv); color:#F4F2EB}
button.wahl.rot[aria-pressed="true"]{background:var(--rost); border-color:var(--rost); color:#F4F2EB}
button.chip[aria-pressed="true"]{
  border-color:var(--messing); color:var(--tinte); font-weight:600;
  box-shadow:inset 0 0 0 1px var(--messing)
}
.frage{padding-top:14px; border-top:1px solid var(--linie-fein); margin-top:14px}
.frage p{font-size:15px; margin:0 0 9px; font-weight:500}
.frage .nr{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--messing); margin-right:7px}
.frage .hinweis{font-size:13px; color:var(--tinte-weich); margin:8px 0 0}
textarea{
  width:100%; margin-top:14px; min-height:74px; resize:vertical;
  font-family:"Newsreader",Georgia,serif; font-size:15px; line-height:1.5;
  color:var(--tinte); background:var(--blatt);
  border:1px solid var(--linie); border-radius:2px; padding:10px 12px
}
textarea::placeholder{color:var(--tinte-leise)}

/* ---------- Anhang ---------- */
.anhang{margin-top:46px; border-top:2px solid var(--tinte); padding-top:22px}
.anhang h2{font-size:20px; font-weight:600; letter-spacing:-.01em; margin:0 0 4px}
.anhang > p{color:var(--tinte-weich); font-size:15px; max-width:62ch}
.liste{margin:16px 0 0; padding:0; list-style:none; display:grid; gap:0}
.liste li{
  display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; align-items:baseline;
  padding:9px 0; border-top:1px solid var(--linie-fein); font-size:14.5px
}
.liste li .was{font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--messing); white-space:nowrap}
.liste li .warum{color:var(--tinte-weich)}
.ruhend{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; margin-top:18px}
.ruhend article{border:1px dashed var(--linie); border-radius:3px; padding:14px 16px; background:var(--blatt)}
.ruhend h4{font-family:"Archivo",sans-serif; font-size:14px; margin:0 0 5px; font-weight:600}
.ruhend p{font-size:13.5px; color:var(--tinte-weich); margin:0}
.ruhend .code{font-size:11.5px; display:inline-block; margin-bottom:8px}
.fuss{margin-top:40px; padding-top:16px; border-top:1px solid var(--linie); font-size:13px; color:var(--tinte-leise)}

/* ---------- Lupe ---------- */
#lupe{
  position:fixed; inset:0; z-index:90; background:rgba(20,17,13,.92);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  gap:12px; padding:24px; cursor:zoom-out
}
#lupe img{
  max-width:min(1600px,96vw); max-height:84vh; object-fit:contain;
  background:#fff; border-radius:2px; padding:6px
}
#lupe p{color:#EDE7D9; font-size:13px; max-width:60ch; text-align:center; margin:0; font-family:"Archivo",sans-serif}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

        if (offenerStand) sichern();
      }).catch(function () { bereit = true; melden("Nur Ansicht · Änderungen bleiben auf diesem Gerät"); });
    } else { bereit = true; melden("Nur Ansicht"); }
  } catch (e) { bereit = true; melden("Nur Ansicht"); }

  function kurzDatum(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return ("0" + d.getDate()).slice(-2) + "." + ("0" + (d.getMonth() + 1)).slice(-2) + ". " +
      ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  function sichern() {
    STATE.aktualisiert = new Date().toISOString();
    if (!bereit) { offenerStand = true; return; }
    if (!artefakt) { offenerStand = true; melden("Nicht gespeichert · nur Ansicht"); return; }
    offenerStand = false;
    melden("Speichert …");
    clearTimeout(wartend);
    wartend = setTimeout(function () {
      artefakt.publish(baueDokument()).then(function () {
        melden("Gespeichert · " + uhrzeit());
      }).catch(function (err) {
        var code = err && err.code;
        melden(code === "conflict" ? "Jemand anderes war schneller — die Seite lädt neu"
             : code === "not_granted" || code === "not_writer" ? "Nur Ansicht · nicht gespeichert"
             : "Nicht gespeichert (" + (code || "Fehler") + ")");
      });
    }, 700);
  }

  document.getElementById("app").addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-akt]");
    if (!el) return;
    var akt = el.getAttribute("data-akt");

    if (akt === "status") {
      var code = el.getAttribute("data-modell"), wert = el.getAttribute("data-wert");
      var jetzt = statusVon(code);
      var neu = jetzt === wert ? "offen" : wert;
      if (!STATE.modelle[code]) STATE.modelle[code] = { status: "offen", notiz: "" };
      STATE.modelle[code].status = neu;
      var gruppe = el.parentNode.querySelectorAll("button.wahl");
      for (var i = 0; i < gruppe.length; i++) {
        gruppe[i].setAttribute("aria-pressed", gruppe[i].getAttribute("data-wert") === neu ? "true" : "false");
      }
      var pill = document.querySelector('[data-pill="' + code + '"]');
      if (pill) { pill.className = "pill " + STATUS[neu].k; pill.textContent = STATUS[neu].label; }
      zaehlerAktualisieren(); sichern();

    } else if (akt === "frage") {
      var id = el.getAttribute("data-frage"), w = el.getAttribute("data-wert");
      STATE.fragen[id] = STATE.fragen[id] === w ? "" : w;
      var chips = el.parentNode.querySelectorAll("button.chip");
      for (var c = 0; c < chips.length; c++) {
        chips[c].setAttribute("aria-pressed", chips[c].getAttribute("data-wert") === STATE.fragen[id] ? "true" : "false");
      }
      zaehlerAktualisieren(); sichern();

    } else if (akt === "lupe") {
      document.getElementById("lupe-bild").src = el.getAttribute("data-src");
      document.getElementById("lupe-bild").alt = el.getAttribute("data-text");
      document.getElementById("lupe-text").textContent = el.getAttribute("data-text");
      lupe.hidden = false;
    }
  });

  document.getElementById("app").addEventListener("input", function (ev) {
    var el = ev.target;
    if (el.getAttribute && el.getAttribute("data-akt") === "notiz") {
      var code = el.getAttribute("data-modell");
      if (!STATE.modelle[code]) STATE.modelle[code] = { status: "offen", notiz: "" };
      STATE.modelle[code].notiz = el.value;
      sichern();
    }
  });

  lupe.addEventListener("click", function () { lupe.hidden = true; });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && !lupe.hidden) lupe.hidden = true;
  });

  zaehlerAktualisieren();
})();
</script>
