<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="780" viewBox="0 0 1820 780" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="pappe" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.08" numOctaves="4" seed="5" result="r"/>
      <feColorMatrix in="r" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="k"><feFuncA type="linear" slope="0.55" intercept="0.05"/></feComponentTransfer>
      <feComposite in="k" in2="SourceGraphic" operator="in" result="ka"/>
      <feBlend in="SourceGraphic" in2="ka" mode="multiply"/>
    </filter>
    <filter id="seide" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="3" seed="11" result="r"/>
      <feColorMatrix in="r" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="k"><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feComposite in="k" in2="SourceGraphic" operator="in" result="ka"/>
      <feBlend in="SourceGraphic" in2="ka" mode="multiply"/>
    </filter>
    <filter id="wurf" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2a251d" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="leder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9C9B95"/><stop offset="55%" stop-color="#84837E"/><stop offset="100%" stop-color="#5E5D59"/>
    </linearGradient>
    <linearGradient id="messing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4C476"/><stop offset="45%" stop-color="#C9A24E"/><stop offset="100%" stop-color="#8A6A22"/>
    </linearGradient>
  </defs>

  <rect width="1820" height="780" fill="#F3F1EC"/>
  <text x="60" y="58" font-size="27" font-weight="bold" fill="#211C15">VERP-01 — Die Kiste zum Auspacken</text>
  <text x="60" y="88" font-size="16" fill="#5E5648">Alles aus Lagerformaten: Stülpdeckelkarton Naturkarton · bedruckte Banderole · Seidenpapier · Siegelaufkleber · Kraftanhänger · Pflegekarte. Keine Stanzform, kein Umkarton.</text>

  <!-- ══ 1 · geschlossen ══ -->
  <g transform="translate(70,170)">
    <g filter="url(#wurf)">
      <g filter="url(#pappe)">
        <polygon points="0,120 300,120 300,250 0,250" fill="#B2946E"/>
        <polygon points="0,120 80,64 380,64 300,120" fill="#CBAF8C"/>
        <polygon points="300,120 380,64 380,194 300,250" fill="#93765A"/>
      </g>
      <!-- Deckelkante -->
      <polygon points="0,120 300,120 300,138 0,138" fill="#000" fill-opacity="0.07"/>
      <polygon points="300,120 380,64 380,82 300,138" fill="#000" fill-opacity="0.10"/>
      <!-- Banderole -->
      <polygon points="105,120 175,120 175,250 105,250" fill="#8E6E48"/>
      <polygon points="105,120 185,64 255,64 175,120" fill="#A8845A"/>
      <text x="140" y="175" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="2.6" fill="#F3F1EC">BELLO</text>
      <text x="140" y="193" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="2.6" fill="#F3F1EC">WERK</text>
      <text x="140" y="215" text-anchor="middle" font-size="9" fill="#E6D8C0">Hamburg Nr. 1</text>
      <text x="140" y="228" text-anchor="middle" font-size="9" fill="#E6D8C0">M · Grau</text>
    </g>
    <text x="0" y="310" font-size="15" font-weight="bold" fill="#211C15">1 · Banderole abstreifen</text>
    <text x="0" y="333" font-size="13.5" fill="#5E5648">Kraftpapier, 1-farbig bedruckt. Sie hält den Deckel —</text>
    <text x="0" y="352" font-size="13.5" fill="#5E5648">kein Klebeband, kein Aufreißfaden. Die Kiste ist</text>
    <text x="0" y="371" font-size="13.5" fill="#5E5648">zugleich der Versandkarton.</text>
  </g>

  <!-- ══ 2 · Deckel ab ══ -->
  <g transform="translate(640,170)">
    <g filter="url(#wurf)">
      <!-- Unterteil -->
      <g filter="url(#pappe)">
        <polygon points="0,140 300,140 300,250 0,250" fill="#B2946E"/>
        <polygon points="300,140 380,84 380,194 300,250" fill="#93765A"/>
        <polygon points="0,140 80,84 380,84 300,140" fill="#A98B67"/>
      </g>
      <!-- Innenraum mit Seidenpapier -->
      <polygon points="14,132 86,82 372,82 300,132" fill="#6E5942"/>
      <g filter="url(#seide)">
        <polygon points="26,128 96,86 360,86 292,128" fill="#EFE7D6"/>
        <polygon points="40,124 150,92 300,96 250,126" fill="#F7F2E6"/>
      </g>
      <circle cx="176" cy="108" r="17" fill="#B2703A"/>
      <circle cx="176" cy="108" r="17" fill="none" stroke="#7A4A22" stroke-width="1.5"/>
      <text x="176" y="106" text-anchor="middle" font-size="7" font-weight="600" letter-spacing="1" fill="#F3EEE2">BELLO</text>
      <text x="176" y="115" text-anchor="middle" font-size="7" font-weight="600" letter-spacing="1" fill="#F3EEE2">WERK</text>
      <!-- abgehobener Deckel -->
      <g transform="translate(150,-92)" filter="url(#pappe)">
        <polygon points="0,120 300,120 300,152 0,152" fill="#B2946E"/>
        <polygon points="0,120 80,64 380,64 300,120" fill="#CBAF8C"/>
        <polygon points="300,120 380,64 380,96 300,152" fill="#93765A"/>
      </g>
      <path d="M 330 40 C 350 70 340 96 320 110" stroke="#877E6D" stroke-width="2" fill="none" stroke-dasharray="7 6"/>
      <path d="M 320 110 l 10 -10 M 320 110 l 1 -14" stroke="#877E6D" stroke-width="2" fill="none"/>
    </g>
    <text x="0" y="310" font-size="15" font-weight="bold" fill="#211C15">2 · Deckel ab, Seidenpapier</text>
    <text x="0" y="333" font-size="13.5" fill="#5E5648">Stülpdeckel, kein Widerstand. Darunter Seidenpapier,</text>
    <text x="0" y="352" font-size="13.5" fill="#5E5648">gesiegelt mit einem runden Aufkleber Ø 40 mm.</text>
    <text x="0" y="371" font-size="13.5" fill="#5E5648">Das Knistern kann man nicht planen — es bleibt hängen.</text>
  </g>

  <!-- ══ 3 · offen ══ -->
  <g transform="translate(1210,170)">
    <g filter="url(#wurf)">
      <g filter="url(#pappe)">
        <polygon points="0,140 300,140 300,250 0,250" fill="#B2946E"/>
        <polygon points="300,140 380,84 380,194 300,250" fill="#93765A"/>
        <polygon points="0,140 80,84 380,84 300,140" fill="#A98B67"/>
      </g>
      <polygon points="14,132 86,82 372,82 300,132" fill="#6E5942"/>
      <g filter="url(#seide)"><polygon points="26,128 96,86 360,86 292,128" fill="#EFE7D6"/></g>

      <!-- gerolltes Halsband -->
      <g transform="translate(120,84)">
        <ellipse cx="0" cy="18" rx="66" ry="30" fill="url(#leder)"/>
        <ellipse cx="0" cy="18" rx="66" ry="30" fill="none" stroke="#3C3934" stroke-width="2"/>
        <ellipse cx="0" cy="14" rx="40" ry="17" fill="#6E6D68"/>
        <ellipse cx="0" cy="14" rx="40" ry="17" fill="none" stroke="#3C3934" stroke-width="1.6"/>
        <ellipse cx="0" cy="11" rx="20" ry="8" fill="#575652"/>
        <!-- Patch auf der Rolle -->
        <rect x="-34" y="0" width="62" height="15" rx="4" fill="#A0602E" stroke="#5E3618" stroke-width="1.2" transform="rotate(-8)"/>
        <text x="-3" y="10" text-anchor="middle" font-size="6.5" font-weight="600" letter-spacing="1.1" fill="#31200F" transform="rotate(-8)">BELLOWERK</text>
        <!-- Messing blitzt -->
        <rect x="42" y="6" width="16" height="13" rx="3" fill="url(#messing)" stroke="#6C4F12" stroke-width="1"/>
        <!-- Papierband -->
        <path d="M -30 -6 C -22 12 -22 26 -30 42" stroke="#C8B48E" stroke-width="7" fill="none"/>
      </g>

      <!-- Anhänger an Kordel -->
      <g transform="translate(224,100)">
        <path d="M -16 -6 C -8 2 -4 6 0 8" stroke="#A89474" stroke-width="2" fill="none"/>
        <rect x="0" y="6" width="42" height="26" rx="3" fill="#D9C7A4" stroke="#8E7A55" stroke-width="1.4" transform="rotate(-12)"/>
        <text x="8" y="21" font-size="7" fill="#4A3C26" transform="rotate(-12)">HAMBURG 1</text>
        <text x="8" y="30" font-size="6" fill="#6B5B41" transform="rotate(-12)">M · 38–48 cm</text>
      </g>

      <!-- Pflegekarte -->
      <g transform="translate(186,120)">
        <rect x="0" y="0" width="86" height="40" rx="2" fill="#F1EADB" stroke="#B9A98A" stroke-width="1.3" transform="skewX(-28)"/>
        <g transform="skewX(-28)" fill="#8A7C63">
          <rect x="8" y="9" width="62" height="2.4"/><rect x="8" y="16" width="66" height="2.4"/>
          <rect x="8" y="23" width="52" height="2.4"/><rect x="8" y="30" width="58" height="2.4"/>
        </g>
      </g>
    </g>
    <text x="0" y="310" font-size="15" font-weight="bold" fill="#211C15">3 · Produkt, Anhänger, Pflegekarte</text>
    <text x="0" y="333" font-size="13.5" fill="#5E5648">Halsband gerollt, mit Papierband gebunden, Messing</text>
    <text x="0" y="352" font-size="13.5" fill="#5E5648">nach oben. Kraftanhänger an Jutekordel mit Modell,</text>
    <text x="0" y="371" font-size="13.5" fill="#5E5648">Größe, Charge und GPSR-Adresse. Pflegekarte A6.</text>
  </g>

  <!-- Maße und Hinweis -->
  <g transform="translate(70,600)">
    <line x1="0" y1="0" x2="1680" y2="0" stroke="#CBC4B4" stroke-width="1.5"/>
    <text x="0" y="30" font-size="14" fill="#211C15" font-weight="bold">Zielmaße aus Lagerformaten</text>
    <text x="0" y="54" font-size="13.5" fill="#5E5648">Halsband ca. 170 × 120 × 50 mm · Leine ca. 230 × 170 × 60 mm · Set später ca. 250 × 180 × 80 mm</text>
    <text x="0" y="78" font-size="13.5" fill="#5E5648">Kosten grob 1,00–2,30 € je Paket, alle Teile ab kleiner Auflage. Sondergrößen kosten Werkzeug — deshalb Produkt ins Format legen, nicht Format ums Produkt bauen.</text>
    <text x="1680" y="78" text-anchor="end" font-size="12" fill="#877E6D">Darstellung nach VERP-01 v0.2 — keine Fotografie</text>
  </g>
</svg>
