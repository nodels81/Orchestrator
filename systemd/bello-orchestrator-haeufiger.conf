# Drop-in fuer bello-orchestrator.timer — haeufigere Laeufe.
#
# Die leere erste Zeile loescht den bestehenden Wert; ohne sie kaeme der neue
# Zeitplan zum alten 07:00-Eintrag hinzu statt ihn zu ersetzen.
#
# Ein Lauf ohne offene Auftraege kostet nichts: der Orchestrator bricht mit
# "Keine offenen Auftraege" ab, bevor ein einziger API-Aufruf entsteht.
[Timer]
OnCalendar=
OnCalendar=*-*-* 07..19:00:00
RandomizedDelaySec=180
Persistent=true
