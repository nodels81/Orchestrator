# Vorlage für wordpress/zugang.conf
#
# Kopieren, ausfüllen, Rechte setzen:
#   cp wordpress/zugang.beispiel.conf wordpress/zugang.conf
#   chmod 600 wordpress/zugang.conf
#
# zugang.conf steht in .gitignore und darf NIE nach Git.
# Kein Passwort in dieser Datei: die Anmeldung läuft über einen SSH-Schlüssel.
#   ssh-keygen -t ed25519 -C "bellowerk-hochladen"
#   ssh-copy-id BENUTZER@HOST      (oder den öffentlichen Schlüssel im KAS hinterlegen)

SFTP_HOST="wXXXXXXX.kasserver.com"
SFTP_USER="sshBENUTZER"
ZIELPFAD="/www/htdocs/BENUTZER/bellowerk.de/wp-content/themes/bellowerk"
