<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Bellowerk: Lederriemen mit Messingring">
  <!-- Voller Anschnitt, damit das Symbol auch beschnitten (maskable) traegt. -->
  <rect width="512" height="512" fill="#5c4433"/>
  <!-- Riemen quer, wie ein Halsband -->
  <rect x="0" y="196" width="512" height="120" fill="#9a6238"/>
  <line x1="0" y1="206" x2="512" y2="206" stroke="#7d4e2c" stroke-width="5"/>
  <line x1="0" y1="306" x2="512" y2="306" stroke="#7d4e2c" stroke-width="5"/>
  <!-- Messingring in der Mitte -->
  <circle cx="256" cy="256" r="84" fill="none" stroke="#b08d57" stroke-width="30"/>
  <circle cx="256" cy="256" r="84" fill="none" stroke="#d9b87d" stroke-width="8"/>
  <!-- Zwei Buchschrauben -->
  <circle cx="120" cy="256" r="17" fill="#b08d57"/>
  <circle cx="392" cy="256" r="17" fill="#b08d57"/>
</svg>
